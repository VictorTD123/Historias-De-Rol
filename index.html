function create(creator) {
  let state = {}
  const listeners = new Set()
  
  const get = () => state
  const set = (partial) => {
    const next = typeof partial === 'function' ? partial(state) : partial
    state = { ...state, ...next }
    listeners.forEach(l => l(state))
  }
  
  state = creator(set, get)
  
  function useStore(selector) {
    const [, forceRender] = React.useReducer(x => x + 1, 0)
    const selectorRef = React.useRef(selector)
    const stateRef = React.useRef(selector ? selector(state) : state)
    selectorRef.current = selector
    
    React.useEffect(() => {
      const listener = (newState) => {

          forceRender()
        }
      }
      listeners.add(listener)
      return () => listeners.delete(listener)
    }, [])
    
    return selector ? selector(state) : state
  }
  
  useStore.getState = get

  return useStore

const handleError = (error, toast) => {
  if (error) {
    console.error('Supabase error:', error)
    if (toast) toast(error.message || 'Error de conexion', 'error')
    return true
  }
  return false
}

// ─────────────────────────────────────────────────────────────────────────────
// ESTADO INICIAL
// ─────────────────────────────────────────────────────────────────────────────
const estadoInicial = () => ({
  usuarioActual: null,
  usuarios: [],
  partidas: [],
  partidaActiva: null,
  personajes: [],
  pnjs: [...SEED_PNJS],
  enemigos: [...SEED_ENEMIGOS],
  clases: [...CLASES_BASE],
  armas: [...ARMAS_BASE],
  estadosDisponibles: [...ESTADOS_BASE],
  iniciativa: [],
  log: [],
  tiradas: [],
  toasts: [],
  vista: 'login',
  combateActivo: false,
  turnoActual: 0,
  modalActivo: null,
  supabaseReady: false,
})

// ─────────────────────────────────────────────────────────────────────────────
// STORE CON SUPABASE
// ─────────────────────────────────────────────────────────────────────────────
const useStore = create((set, get) => {
  const subscriptions = []

  const subscribeToPartida = (partidaId) => {
    subscriptions.forEach(sub => sub.unsubscribe())
    subscriptions.length = 0

    if (!partidaId) return

    const personajesChannel = supabaseClient
      .channel('personajes:' + partidaId)
      .on('postgres_changes', {
        event: '*', schema: 'public', table: 'personajes',
        filter: 'partida_id=eq.' + partidaId
      }, (payload) => {
        if (payload.eventType === 'INSERT') {
          set(s => ({ personajes: [...s.personajes, payload.new] }))
        } else if (payload.eventType === 'UPDATE') {
          set(s => ({
            personajes: s.personajes.map(p => p.id === payload.new.id ? payload.new : p)
          }))
        } else if (payload.eventType === 'DELETE') {
          set(s => ({
            personajes: s.personajes.filter(p => p.id !== payload.old.id)
          }))
        }
      })
      .subscribe()
    subscriptions.push(personajesChannel)

    const escenasChannel = supabaseClient
      .channel('escenas:' + partidaId)
      .on('postgres_changes', {
        event: '*', schema: 'public', table: 'escenas',
        filter: 'partida_id=eq.' + partidaId
      }, (payload) => {
        const { partidaActiva } = get()
        if (!partidaActiva) return
        let nuevasEscenas = [...(partidaActiva.escenas || [])]
        if (payload.eventType === 'INSERT') nuevasEscenas.push(payload.new)
        else if (payload.eventType === 'UPDATE') nuevasEscenas = nuevasEscenas.map(e => e.id === payload.new.id ? payload.new : e)
        else if (payload.eventType === 'DELETE') nuevasEscenas = nuevasEscenas.filter(e => e.id !== payload.old.id)
        set({
          partidaActiva: { ...partidaActiva, escenas: nuevasEscenas },
          partidas: get().partidas.map(p => p.id === partidaId ? { ...p, escenas: nuevasEscenas } : p)
        })
      })
      .subscribe()
    subscriptions.push(escenasChannel)

    const logChannel = supabaseClient
      .channel('log:' + partidaId)
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'log_eventos',
        filter: 'partida_id=eq.' + partidaId
      }, (payload) => {
        set(s => ({ log: [payload.new, ...s.log].slice(0, 150) }))
      })
      .subscribe()
    subscriptions.push(logChannel)

    const enemigosChannel = supabaseClient
      .channel('enemigos:' + partidaId)
      .on('postgres_changes', {
        event: '*', schema: 'public', table: 'enemigos_combate',
        filter: 'partida_id=eq.' + partidaId
      }, (payload) => {
        const { partidaActiva } = get()
        if (!partidaActiva) return
        let nuevos = [...(partidaActiva.enemigosEnCombate || [])]
        if (payload.eventType === 'INSERT') nuevos.push(payload.new)
        else if (payload.eventType === 'UPDATE') nuevos = nuevos.map(e => e.id === payload.new.id ? payload.new : e)
        else if (payload.eventType === 'DELETE') nuevos = nuevos.filter(e => e.id !== payload.old.id)
        set({
          partidaActiva: { ...partidaActiva, enemigosEnCombate: nuevos },
          partidas: get().partidas.map(p => p.id === partidaId ? { ...p, enemigosEnCombate: nuevos } : p)
        })
      })
      .subscribe()
    subscriptions.push(enemigosChannel)

    const iniciativaChannel = supabaseClient
      .channel('iniciativa:' + partidaId)
      .on('postgres_changes', {
        event: '*', schema: 'public', table: 'iniciativa',
        filter: 'partida_id=eq.' + partidaId
      }, (payload) => {
        if (payload.eventType === 'INSERT') set(s => ({ iniciativa: [...s.iniciativa, payload.new] }))
        else if (payload.eventType === 'UPDATE') set(s => ({ iniciativa: s.iniciativa.map(i => i.id === payload.new.id ? payload.new : i) }))
        else if (payload.eventType === 'DELETE') set(s => ({ iniciativa: s.iniciativa.filter(i => i.id !== payload.old.id) }))
      })
      .subscribe()
    subscriptions.push(iniciativaChannel)
  }

  return {
    ...estadoInicial(),

    toast: (msg, tipo = 'info') => {
      const id = genId()
      set(s => ({ toasts: [...s.toasts, { id, mensaje: msg, tipo }] }))
      setTimeout(() => set(s => ({ toasts: s.toasts.filter(t => t.id !== id) })), 3500)
    },
    cerrarToast: id => set(s => ({ toasts: s.toasts.filter(t => t.id !== id) })),

    registrar: async (email, password, rol, nombre) => {
      const { data: authData, error: authError } = await supabaseClient.auth.signUp({
        email, password, options: { data: { nombre, rol } }
      })
      if (handleError(authError, get().toast)) return false
      if (authData.user) {
        const { error: dbError } = await supabaseClient.from('usuarios').insert({
          id: authData.user.id, email, nombre, rol, creado_en: now()
        })
        if (handleError(dbError, get().toast)) return false
        const usuario = { id: authData.user.id, email, nombre, rol, creadoEn: now() }
        set({ usuarioActual: usuario, vista: 'lobby' })
        get().toast('Bienvenido, ' + nombre + '!', 'success')
        return true
      }
      return false
    },

    login: async (email, password, rol) => {
      const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({ email, password })
      if (handleError(authError, get().toast)) return false
      if (authData.user) {
        const { data: userData, error: userError } = await supabaseClient.from('usuarios').select('*').eq('id', authData.user.id).single()
        if (handleError(userError, get().toast)) return false
        if (userData && userData.rol === rol) {
          set({ usuarioActual: userData, vista: 'lobby' })
          get().toast('Bienvenido de nuevo, ' + userData.nombre + '!', 'success')
          await get().cargarPartidasUsuario()
          return true
        } else {
          get().toast('Rol incorrecto', 'error')
          await supabaseClient.auth.signOut()
          return false
        }
      }
      return false
    },

    logout: async () => {
      await supabaseClient.auth.signOut()
      subscriptions.forEach(sub => sub.unsubscribe())
      subscriptions.length = 0
      set({ usuarioActual: null, partidaActiva: null, vista: 'login', combateActivo: false, iniciativa: [], log: [], tiradas: [], personajes: [], partidas: [] })
    },

    checkSession: async () => {
      const { data: { session } } = await supabaseClient.auth.getSession()
      if (session) {
        const { data: userData } = await supabaseClient.from('usuarios').select('*').eq('id', session.user.id).single()
        if (userData) {
          set({ usuarioActual: userData, vista: 'lobby' })
          await get().cargarPartidasUsuario()
        }
      }
      set({ supabaseReady: true })
    },

    cargarPartidasUsuario: async () => {
      const { usuarioActual } = get()
      if (!usuarioActual) return
      const { data: partidasDJ } = await supabaseClient.from('partidas').select('*').eq('dj_id', usuarioActual.id)
      const { data: partidasJugador } = await supabaseClient.from('partida_jugadores').select('partida_id, partidas(*)').eq('usuario_id', usuarioActual.id)
      const todas = [...(partidasDJ || []), ...(partidasJugador?.map(pj => pj.partidas) || [])]
      set({ partidas: todas })
    },

    crearPartida: async (nombre) => {
      const { usuarioActual, toast } = get()
      if (!usuarioActual) return null
      const codigo = genCode()
      const { data, error } = await supabaseClient.from('partidas').insert({
        codigo, nombre, dj_id: usuarioActual.id, estado: 'lobby', creada_en: now()
      }).select().single()
      if (handleError(error, toast)) return null
      await supabaseClient.from('partida_jugadores').insert({ partida_id: data.id, usuario_id: usuarioActual.id })
      const nuevasPartidas = [...get().partidas, data]
      set({ partidas: nuevasPartidas, partidaActiva: data, vista: 'dj', log: [], tiradas: [], iniciativa: [], combateActivo: false })
      subscribeToPartida(data.id)
      toast('Partida "' + nombre + '" creada. Codigo: ' + data.codigo, 'success')
      return data
    },

    unirseAPartida: async (codigo) => {
      const { usuarioActual, toast, partidas } = get()
      const { data: partida, error } = await supabaseClient.from('partidas').select('*').eq('codigo', codigo.toUpperCase()).single()
      if (error || !partida) { toast('Codigo no encontrado', 'error'); return false }
      if (partida.estado === 'finalizada') { toast('Esa partida ya finalizo', 'error'); return false }
      const { data: yaUnido } = await supabaseClient.from('partida_jugadores').select('*').eq('partida_id', partida.id).eq('usuario_id', usuarioActual.id).single()
      if (!yaUnido) {
        const { error: joinError } = await supabaseClient.from('partida_jugadores').insert({ partida_id: partida.id, usuario_id: usuarioActual.id })
        if (handleError(joinError, toast)) return false
      }
      const { data: personajesPartida } = await supabaseClient.from('personajes').select('*').eq('partida_id', partida.id)
      const { data: escenas } = await supabaseClient.from('escenas').select('*').eq('partida_id', partida.id)
      const partidaCompleta = { ...partida, escenas: escenas || [] }
      set({ partidas: [...partidas, partidaCompleta], partidaActiva: partidaCompleta, personajes: personajesPartida || [], vista: 'jugador' })
      subscribeToPartida(partida.id)
      toast('Te has unido a "' + partida.nombre + '"', 'success')
      return true
    },

    cargarPartida: async (pid) => {
      const { usuarioActual } = get()
      const { data: partida } = await supabaseClient.from('partidas').select('*').eq('id', pid).single()
      if (!partida) return
      const { data: escenas } = await supabaseClient.from('escenas').select('*').eq('partida_id', pid)
      const { data: personajes } = await supabaseClient.from('personajes').select('*').eq('partida_id', pid)
      const partidaCompleta = { ...partida, escenas: escenas || [] }
      set({ partidaActiva: partidaCompleta, personajes: personajes || [], vista: partida.dj_id === usuarioActual.id ? 'dj' : 'jugador', combateActivo: partida.estado === 'activa' })
      subscribeToPartida(pid)
    },

    actualizarPartida: async (cambios) => {
      const { partidaActiva } = get()
      if (!partidaActiva) return
      const { error } = await supabaseClient.from('partidas').update(cambios).eq('id', partidaActiva.id)
      if (error) console.error('Error actualizando partida:', error)
      const actualizada = { ...partidaActiva, ...cambios }
      set({ partidaActiva: actualizada, partidas: get().partidas.map(p => p.id === partidaActiva.id ? actualizada : p) })
    },

    crearEscena: async (datos) => {
      const { partidaActiva } = get()
      if (!partidaActiva) return
      const { data, error } = await supabaseClient.from('escenas').insert({
        partida_id: partidaActiva.id, titulo: datos.titulo, descripcion: datos.descripcion,
        imagen: datos.imagen, tipo: datos.tipo, orden: (partidaActiva.escenas || []).length, is_activa: false
      }).select().single()
      if (error) { console.error(error); return }
      return data
    },

    activarEscena: async (eid) => {
      const { partidaActiva, actualizarPartida, agregarLog, combateActivo } = get()
      if (!partidaActiva) return
      await supabaseClient.from('escenas').update({ is_activa: false }).eq('partida_id', partidaActiva.id)
      await supabaseClient.from('escenas').update({ is_activa: true }).eq('id', eid)
      const { data: escenas } = await supabaseClient.from('escenas').select('*').eq('partida_id', partidaActiva.id)
      const esc = escenas?.find(e => e.id === eid)
      const extra = esc?.tipo === 'Combate' && !combateActivo ? { estado: 'activa' } : {}
      await actualizarPartida({ escenas, escena_actual_id: eid, ...extra })
      agregarLog('Escena: "' + esc?.titulo + '"')
      get().toast('Escena: "' + esc?.titulo + '"', 'info')
    },

    eliminarEscena: async (eid) => {
      const { partidaActiva, actualizarPartida } = get()
      await supabaseClient.from('escenas').delete().eq('id', eid)
      const nuevaEscenaId = partidaActiva.escena_actual_id === eid ? null : partidaActiva.escena_actual_id
      await actualizarPartida({ escena_actual_id: nuevaEscenaId })
    },

    crearPersonaje: async (datos) => {
      const { usuarioActual, partidaActiva, clases, agregarLog } = get()
      const clase = clases.find(c => c.id === datos.claseId) || CLASES_BASE[0]
      const vidaMax = hpMaxima(clase, 1, datos.con || 10)
      const personajeData = {
        usuario_id: usuarioActual.id, partida_id: partidaActiva?.id, nombre: datos.nombre,
        clase_id: clase.id, nivel: 1, retrato: datos.retrato || '', descripcion: datos.descripcion || '',
        str: datos.str || 10, dex: datos.dex || 10, con: datos.con || 10, int: datos.int || 10,
        wis: datos.wis || 10, cha: datos.cha || 10, vida_max: vidaMax, vida_actual: vidaMax,
        armadura: armorBase(datos.dex || 10), xp: 0, oro: datos.oro || 0,
        recursos_actuales: {}, puntos_pendientes: 0, creado_en: now()
      }
      for (const r of (clase.recursosEspeciales || [])) personajeData.recursos_actuales[r.nombre] = r.max
      const { data, error } = await supabaseClient.from('personajes').insert(personajeData).select().single()
      if (error) { console.error(error); return }
      set(s => ({ personajes: [...s.personajes, data] }))
      agregarLog?.('✨ ' + data.nombre + ' se une a la aventura')
      get().toast('Personaje "' + data.nombre + '" creado', 'success')
      return data
    },

    actualizarPersonaje: async (pid, cambios) => {
      const { personajes, clases } = get()
      const p = personajes.find(x => x.id === pid)
      if (!p) return
      let extra = {}
      if (cambios.con !== undefined || cambios.nivel !== undefined || cambios.clase_id !== undefined) {
        const clase = clases.find(c => c.id === (cambios.clase_id || p.clase_id))
        if (clase) {
          const con = cambios.con ?? p.con, nivel = cambios.nivel ?? p.nivel
          const nvm = hpMaxima(clase, nivel, con)
          extra.vida_max = nvm; extra.vida_actual = Math.min(p.vida_actual + (nvm - p.vida_max), nvm)
        }
      }
      if (cambios.dex !== undefined) extra.armadura = armorBase(cambios.dex)
      const actualizaciones = { ...cambios, ...extra }
      const { error } = await supabaseClient.from('personajes').update(actualizaciones).eq('id', pid)
      if (error) console.error(error)
      set(s => ({ personajes: s.personajes.map(x => x.id === pid ? { ...x, ...actualizaciones } : x) }))
    },

    aplicarDañoPersonaje: async (pid, cantidad) => {
      const { personajes, agregarLog } = get()
      const p = personajes.find(x => x.id === pid)
      if (!p) return
      const nv = Math.max(0, p.vida_actual - cantidad)
      await get().actualizarPersonaje(pid, { vida_actual: nv })
      agregarLog('🩸 ' + p.nombre + ': -' + cantidad + ' HP (' + p.vida_actual + '→' + nv + ')')
    },

    curarPersonaje: async (pid, cantidad) => {
      const { personajes, agregarLog } = get()
      const p = personajes.find(x => x.id === pid)
      if (!p) return
      const nv = Math.min(p.vida_max, p.vida_actual + cantidad)
      await get().actualizarPersonaje(pid, { vida_actual: nv })
      agregarLog('💚 ' + p.nombre + ': +' + cantidad + ' HP (' + p.vida_actual + '→' + nv + ')')
    },

    subirNivel: async (pid) => {
      const { personajes, clases, agregarLog } = get()
      const p = personajes.find(x => x.id === pid)
      if (!p) return
      const clase = clases.find(c => c.id === p.clase_id)
      const nuevoNivel = p.nivel + 1
      const bonusExtra = {}
      for (const b of (clase?.bonificaciones || [])) {
        if (nuevoNivel % b.cadaNiveles === 0) bonusExtra[b.atributo] = (p[b.atributo] || 10) + b.cantidad
      }
      await get().actualizarPersonaje(pid, { nivel: nuevoNivel, puntos_pendientes: (p.puntos_pendientes || 0) + 1, ...bonusExtra })
      agregarLog('⬆️ ' + p.nombre + ' sube al nivel ' + nuevoNivel + '!')
      get().toast('¡' + p.nombre + ' sube al nivel ' + nuevoNivel + '!', 'success')
    },

    ganarXP: async (pid, cantidad) => {
      const { personajes } = get()
      const p = personajes.find(x => x.id === pid)
      if (!p) return
      const nxp = p.xp + cantidad
      await get().actualizarPersonaje(pid, { xp: nxp })
      if (nxp >= xpParaNivel(p.nivel + 1)) await get().subirNivel(pid)
    },

    agregarAlInventario: async (pid, objeto) => {
      const { personajes } = get()
      const p = personajes.find(x => x.id === pid)
      if (!p) return
      if (objeto.apilable !== false) {
        const { data: existente } = await supabaseClient.from('inventario_items').select('*').eq('personaje_id', pid).eq('nombre', objeto.nombre).eq('tipo', objeto.tipo).single()
        if (existente) {
          await supabaseClient.from('inventario_items').update({ cantidad: existente.cantidad + (objeto.cantidad || 1) }).eq('id', existente.id)
          return
        }
      }
      const item = {
        personaje_id: pid, nombre: objeto.nombre, descripcion: objeto.descripcion || '',
        cantidad: objeto.cantidad || 1, tipo: objeto.tipo || 'general', peso: objeto.peso || 0,
        apilable: objeto.apilable !== false, dado_cantidad: objeto.dadoCantidad || null,
        dado_caras: objeto.dadoCaras || null, modificador: objeto.modificador || 0,
        icono: objeto.icono || '📦', slot: objeto.slot || null
      }
      await supabaseClient.from('inventario_items').insert(item)
    },

    quitarDelInventario: async (pid, itemId) => {
      await supabaseClient.from('inventario_items').delete().eq('id', itemId)
    },

    transferirObjeto: async (fromPid, toPid, itemId, cantidad = 1) => {
      const { personajes, toast, agregarLog } = get()
      const from = personajes.find(x => x.id === fromPid)
      const to = personajes.find(x => x.id === toPid)
      if (!from || !to) return
      const { data: item } = await supabaseClient.from('inventario_items').select('*').eq('id', itemId).single()
      if (!item) return
      if (cantidad >= item.cantidad) {
        await supabaseClient.from('inventario_items').delete().eq('id', itemId)
      } else {
        await supabaseClient.from('inventario_items').update({ cantidad: item.cantidad - cantidad }).eq('id', itemId)
      }
      await get().agregarAlInventario(toPid, { ...item, cantidad })
      agregarLog('📦 ' + from.nombre + ' transfiere ' + cantidad + 'x ' + item.nombre + ' a ' + to.nombre)
      toast('Objeto transferido a ' + to.nombre, 'success')
    },

    equiparObjeto: async (pid, itemId, slot) => {
      const { personajes } = get()
      const p = personajes.find(x => x.id === pid)
      if (!p) return
      const eq = { ...(p.equipamiento || {}) }; eq[slot] = itemId
      await supabaseClient.from('personajes').update({ equipamiento: eq }).eq('id', pid)
      set(s => ({ personajes: s.personajes.map(x => x.id === pid ? { ...x, equipamiento: eq } : x) }))
    },

    desequiparObjeto: async (pid, slot) => {
      const { personajes } = get()
      const p = personajes.find(x => x.id === pid)
      if (!p) return
      const eq = { ...(p.equipamiento || {}) }; eq[slot] = null
      await supabaseClient.from('personajes').update({ equipamiento: eq }).eq('id', pid)
      set(s => ({ personajes: s.personajes.map(x => x.id === pid ? { ...x, equipamiento: eq } : x) }))
    },

    aplicarEstado: async (pid, estadoId, duracionOverride) => {
      const { personajes, estadosDisponibles, agregarLog, toast } = get()
      const p = personajes.find(x => x.id === pid)
      if (!p) return
      const def = estadosDisponibles.find(e => e.id === estadoId)
      if (!def) return
      const { data: yaExiste } = await supabaseClient.from('estados_personaje').select('*').eq('personaje_id', pid).eq('estado_id', estadoId).single()
      if (yaExiste) { toast('El personaje ya tiene ese estado', 'warning'); return }
      const nuevo = {
        personaje_id: pid, estado_id: estadoId, nombre: def.nombre, icono: def.icono,
        descripcion: def.descripcion, tipo: def.tipo, efecto: def.efecto,
        valor_efecto: def.valorEfecto, turnos_restantes: duracionOverride || def.duracion, aplicado_en: now()
      }
      await supabaseClient.from('estados_personaje').insert(nuevo)
      agregarLog(def.icono + ' ' + p.nombre + ' recibe estado: ' + def.nombre)
      toast(def.nombre + ' aplicado a ' + p.nombre, def.tipo === 'positivo' ? 'success' : 'warning')
    },

    quitarEstado: async (pid, estadoId) => {
      await supabaseClient.from('estados_personaje').delete().eq('personaje_id', pid).eq('estado_id', estadoId)
    },

    tick_estados: async () => {
      const { personajes } = get()
      for (const p of personajes) {
        const { data: estados } = await supabaseClient.from('estados_personaje').select('*').eq('personaje_id', p.id)
        if (!estados?.length) continue
        for (const e of estados) {
          const restantes = e.turnos_restantes - 1
          if (restantes <= 0) {
            await supabaseClient.from('estados_personaje').delete().eq('id', e.id)
          } else {
            await supabaseClient.from('estados_personaje').update({ turnos_restantes: restantes }).eq('id', e.id)
            if (e.efecto === 'daño_turno') await get().aplicarDañoPersonaje(p.id, e.valor_efecto)
            if (e.efecto === 'cura_turno') await get().curarPersonaje(p.id, e.valor_efecto)
          }
        }
      }
    },

    crearEstadoCustom: async (datos) => {
      const { estadosDisponibles, toast } = get()
      const nuevo = { id: genId(), ...datos }
      set({ estadosDisponibles: [...estadosDisponibles, nuevo] })
      toast('Estado "' + datos.nombre + '" creado', 'success')
    },

    setRelacion: async (pid1, pid2, tipo, valor) => {
      const { partidaActiva, agregarLog } = get()
      if (!partidaActiva) return
      const key = [pid1, pid2].sort().join('|')
      const { data: existente } = await supabaseClient.from('relaciones').select('*').eq('partida_id', partidaActiva.id).eq('pid1', pid1).eq('pid2', pid2).single()
      if (existente) {
        await supabaseClient.from('relaciones').update({ tipo, valor, actualizado_en: now() }).eq('id', existente.id)
      } else {
        await supabaseClient.from('relaciones').insert({ partida_id: partidaActiva.id, pid1, pid2, tipo, valor, actualizado_en: now() })
      }
      agregarLog((RELACION_EMOJI[tipo] || '🔗') + ' Relacion actualizada: ' + tipo + ' (' + valor + ')')
    },

    getRelacion: async (pid1, pid2) => {
      const { partidaActiva } = get()
      const { data } = await supabaseClient.from('relaciones').select('*').eq('partida_id', partidaActiva?.id).or('and(pid1.eq.' + pid1 + ',pid2.eq.' + pid2 + '),and(pid1.eq.' + pid2 + ',pid2.eq.' + pid1 + ')').single()
      return data
    },

    crearArmaCustom: async (datos) => {
      const { armas, usuarioActual, toast } = get()
      const nueva = { id: genId(), creado_por: usuarioActual.id, ...datos, tipo: 'arma' }
      set({ armas: [...armas, nueva] })
      toast('Arma "' + datos.nombre + '" creada', 'success')
      return nueva
    },
    eliminarArmaCustom: async (id) => {
      const { armas } = get()
      set({ armas: armas.filter(a => a.id !== id) })
    },

    agregarHabilidadAClase: async (claseId, habilidad) => {
      const { clases, toast } = get()
      const nueva = { id: genId(), ...habilidad }
      const nuevas = clases.map(c => c.id === claseId ? { ...c, habilidades: [...(c.habilidades || []), nueva] } : c)
      set({ clases: nuevas })
      toast('Habilidad "' + habilidad.nombre + '" anadida', 'success')
    },
    quitarHabilidadDeClase: async (claseId, habId) => {
      const { clases } = get()
      const nuevas = clases.map(c => c.id === claseId ? { ...c, habilidades: (c.habilidades || []).filter(h => h.id !== habId) } : c)
      set({ clases: nuevas })
    },

    crearPnj: async (datos) => {
      const { usuarioActual, toast } = get()
      const p = {
        creado_por: usuarioActual.id, nombre: datos.nombre, imagen: datos.imagen || '',
        descripcion: datos.descripcion || '', afinidad: afinidadPorNivel(datos.nivelAmistad || 50),
        nivel_amistad: datos.nivelAmistad || 50, estado_emocional: datos.estadoEmocional || 'Neutral'
      }
      const { data, error } = await supabaseClient.from('pnjs').insert(p).select().single()
      if (error) { console.error(error); return }
      toast('PNJ "' + datos.nombre + '" creado', 'success')
      return data
    },

    actualizarPnj: async (id, cambios) => {
      let extra = {}
      if (cambios.nivel_amistad !== undefined) extra.afinidad = afinidadPorNivel(cambios.nivel_amistad)
      await supabaseClient.from('pnjs').update({ ...cambios, ...extra }).eq('id', id)
    },

    eliminarPnj: async (id) => {
      await supabaseClient.from('pnjs').delete().eq('id', id)
    },

    invocarPnjEnPartida: async (id) => {
      const { partidaActiva } = get()
      if (!partidaActiva) return
      await supabaseClient.from('pnjs').update({ partida_id: partidaActiva.id, activo: true }).eq('id', id)
    },

    crearEnemigo: async (datos) => {
      const { usuarioActual, toast } = get()
      const e = {
        creado_por: usuarioActual.id, nombre: datos.nombre,
        vida_max: parseInt(datos.vidaMax) || 20, ataque: parseInt(datos.ataque) || 5,
        defensa: parseInt(datos.defensa) || 12, dados_dano: datos.dadosDaño || '1d8',
        habilidades: datos.habilidades || '', tipo: datos.tipo || 'normal'
      }
      const { data, error } = await supabaseClient.from('enemigos').insert(e).select().single()
      if (error) { console.error(error); return }
      toast('Enemigo "' + datos.nombre + '" creado', 'success')
      return data
    },

    actualizarEnemigo: async (id, cambios) => {
      await supabaseClient.from('enemigos').update(cambios).eq('id', id)
    },

    eliminarEnemigo: async (id) => {
      await supabaseClient.from('enemigos').delete().eq('id', id)
    },

    anadirEnemigoACombate: async (id) => {
      const { partidaActiva, enemigos } = get()
      if (!partidaActiva) return
      const base = enemigos.find(e => e.id === id)
      if (!base) return
      const inst = {
        partida_id: partidaActiva.id, enemigo_id: base.id, nombre: base.nombre,
        vida_max: base.vida_max, vida_actual: base.vida_max, ataque: base.ataque,
        defensa: base.defensa, dados_dano: base.dados_dano, tipo: base.tipo,
        derrotado: false, estados: []
      }
      await supabaseClient.from('enemigos_combate').insert(inst)
    },

    danarEnemigoCombate: async (iid, cant) => {
      const { agregarLog } = get()
      const { data: e } = await supabaseClient.from('enemigos_combate').select('*').eq('id', iid).single()
      if (!e) return
      const nv = Math.max(0, e.vida_actual - cant)
      const derrotado = nv === 0
      await supabaseClient.from('enemigos_combate').update({ vida_actual: nv, derrotado }).eq('id', iid)
      agregarLog('⚔️ ' + e.nombre + ': -' + cant + ' HP' + (derrotado ? ' (¡Derrotado!)' : ''))
      if (derrotado) get().toast(e.nombre + ' derrotado', 'success')
    },

    curarEnemigoCombate: async (iid, cant) => {
      const { data: e } = await supabaseClient.from('enemigos_combate').select('*').eq('id', iid).single()
      if (!e) return
      await supabaseClient.from('enemigos_combate').update({
        vida_actual: Math.min(e.vida_max, e.vida_actual + cant), derrotado: false
      }).eq('id', iid)
    },

    eliminarEnemigoCombate: async (iid) => {
      await supabaseClient.from('enemigos_combate').delete().eq('id', iid)
      set(s => ({ iniciativa: s.iniciativa.filter(i => !(i.tipo === 'enemigo' && i.entity_id === iid)) }))
    },

    iniciarIniciativa: async () => {
      const { partidaActiva, personajes } = get()
      if (!partidaActiva) return
      await supabaseClient.from('iniciativa').delete().eq('partida_id', partidaActiva.id)
      const items = []
      const { data: jugadores } = await supabaseClient.from('partida_jugadores').select('usuario_id').eq('partida_id', partidaActiva.id)
      for (const { usuario_id } of (jugadores || [])) {
        const p = personajes.find(x => x.usuario_id === usuario_id && x.partida_id === partidaActiva.id)
        if (p) {
          items.push({
            partida_id: partidaActiva.id, tipo: 'jugador', entity_id: p.id, nombre: p.nombre,
            vida_actual: p.vida_actual, vida_max: p.vida_max, roll: tirarDado(20) + calcMod(p.dex),
            orden: items.length, derrotado: false
          })
        }
      }
      const { data: enemigos } = await supabaseClient.from('enemigos_combate').select('*').eq('partida_id', partidaActiva.id)
      for (const e of (enemigos || [])) {
        items.push({
          partida_id: partidaActiva.id, tipo: 'enemigo', entity_id: e.id, nombre: e.nombre,
          vida_actual: e.vida_actual, vida_max: e.vida_max, roll: tirarDado(20),
          orden: items.length, derrotado: e.derrotado
        })
      }
      items.sort((a, b) => b.roll - a.roll)
      const itemsConOrden = items.map((item, idx) => ({ ...item, orden: idx }))
      for (const item of itemsConOrden) {
        await supabaseClient.from('iniciativa').insert(item)
      }
      set({ iniciativa: itemsConOrden, turnoActual: 0 })
      get().agregarLog('🎲 Iniciativa: ' + itemsConOrden.map(i => i.nombre + '(' + i.roll + ')').join(', '))
    },

    moverEnIniciativa: async (from, to) => {
      const { iniciativa } = get()
      const a = [...iniciativa]
      const [item] = a.splice(from, 1)
      a.splice(to, 0, item)
      for (let i = 0; i < a.length; i++) {
        await supabaseClient.from('iniciativa').update({ orden: i }).eq('id', a[i].id)
      }
      set({ iniciativa: a })
    },

    siguienteTurno: async () => {
      const { iniciativa, turnoActual } = get()
      const next = (turnoActual + 1) % iniciativa.length
      set({ turnoActual: next })
      if (next === 0) await get().tick_estados()
      get().agregarLog('➡️ Turno: ' + iniciativa[next]?.nombre)
    },

    iniciarCombate: async () => {
      await get().actualizarPartida({ estado: 'activa' })
      set({ combateActivo: true })
      await get().iniciarIniciativa()
      get().agregarLog('⚔️ ¡Combate iniciado!')
      get().toast('¡Combate iniciado!', 'warning')
    },

    finalizarCombate: async (xpPorJugador = 50) => {
      const { partidaActiva, personajes } = get()
      for (const uid of (partidaActiva?.jugadores || [])) {
        const p = personajes.find(x => x.usuario_id === uid && x.partida_id === partidaActiva.id)
        if (p) await get().ganarXP(p.id, xpPorJugador)
      }
      await get().actualizarPartida({ estado: 'pausada' })
      await supabaseClient.from('enemigos_combate').delete().eq('partida_id', partidaActiva.id)
      await supabaseClient.from('iniciativa').delete().eq('partida_id', partidaActiva.id)
      set({ combateActivo: false, iniciativa: [], turnoActual: 0 })
      get().agregarLog('🏆 Combate finalizado. +' + xpPorJugador + ' XP por jugador')
      get().toast('Combate finalizado', 'success')
    },

    tirar: async ({ dados, modificador = 0, etiqueta = '', oculta = false, personajeNombre = '' }) => {
      const { usuarioActual, tiradas, agregarLog } = get()
      let total = 0
      const resultados = []
      for (const { cantidad, caras } of dados) {
        const { total: t, resultados: r } = tirarDados(cantidad, caras)
        total += t
        resultados.push(...r.map(v => ({ valor: v, caras })))
      }
      total += modificador
      const esCritico = dados.length === 1 && dados[0].caras === 20 && resultados[0]?.valor === 20
      const esFallo = dados.length === 1 && dados[0].caras === 20 && resultados[0]?.valor === 1
      const t = {
        id: genId(), usuario_id: usuarioActual?.id, partida_id: get().partidaActiva?.id,
        nombre: personajeNombre || usuarioActual?.nombre || 'DJ', etiqueta, dados, modificador,
        resultados, total, es_critico: esCritico, es_fallo: esFallo, oculta, hora: hora()
      }
      await supabaseClient.from('tiradas').insert(t)
      const nuevas = [t, ...tiradas].slice(0, 30)
      set({ tiradas: nuevas })
      if (!oculta) {
        const dstr = dados.map(d => d.cantidad + 'd' + d.caras).join('+')
        const mstr = modificador !== 0 ? (modificador > 0 ? '+' + modificador : '' + modificador) : ''
        agregarLog('🎲 ' + t.nombre + ' → ' + dstr + mstr + ': **' + total + '**' + (esCritico ? ' 🌟' : esFallo ? ' 💀' : ''))
      }
      return t
    },

    agregarLog: async (msg, tipo = 'info') => {
      const { partidaActiva, log } = get()
      if (!partidaActiva) return
      const entry = {
        partida_id: partidaActiva.id, usuario_id: get().usuarioActual?.id,
        mensaje: msg, tipo, hora: hora()
      }
      await supabaseClient.from('log_eventos').insert(entry)
      set({ log: [{ id: genId(), mensaje: msg, tipo, hora: hora() }, ...log].slice(0, 150) })
    },

    abrirModal: (n, d = {}) => set({ modalActivo: { nombre: n, datos: d } }),
    cerrarModal: () => set({ modalActivo: null }),
    setVista: v => set({ vista: v }),
  }
})

function ToastContainer() {
  const toasts = useStore(s => s.toasts)
  const cerrarToast = useStore(s => s.cerrarToast)
  const ico = {success:'✓',error:'✕',warning:'⚠',info:'ℹ'}
  return (
    <div className="toast-container">
      {toasts.map(t=>(
        <div key={t.id} className={`toast toast-${t.tipo}`} onClick={()=>cerrarToast(t.id)}>
          <span style={{fontSize:15}}>{ico[t.tipo]||'ℹ'}</span>
          <span style={{flex:1}}>{t.mensaje}</span>
        </div>
      ))}
    </div>
  )
}

function Modal({titulo,children,onClose,size=''}) {
  useEffect(()=>{
    const h=e=>{if(e.key==='Escape')onClose?.()}
    document.addEventListener('keydown',h); return()=>document.removeEventListener('keydown',h)
  },[onClose])
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose?.()}>
      <div className={`modal ${size}`}>
        <div className="flex items-center justify-between mb-3">
          <div className="modal-title" style={{margin:0}}>{titulo}</div>
          <button className="btn btn-ghost btn-icon btn-sm" onClick={onClose}>✕</button>
        </div>
        {children}
      </div>
    </div>
  )
}

function HPBar({actual,max,showNumbers=true,height=8}) {
  const pct=max>0?actual/max:0
  const cls=pct>0.5?'hp-high':pct>0.25?'hp-mid':'hp-low'
  return (
    <div>
      {showNumbers&&<div className="flex justify-between" style={{marginBottom:3}}>
        <span style={{fontSize:11,color:'var(--text-muted)'}}>HP</span>
        <span style={{fontSize:11}}>{actual}/{max}</span>
      </div>}
      <div className="hp-bar" style={{height}}>
        <div className={`hp-fill ${cls}`} style={{width:`${Math.max(0,pct*100)}%`}}/>
      </div>
    </div>
  )
}

function XPBar({xp,nivel}) {
  const base=Math.floor(100*nivel*(nivel-1)/2)
  const siguiente=Math.floor(100*(nivel+1)*nivel/2)
  const pct=Math.min(1,(xp-base)/(siguiente-base||1))
  return (
    <div>
      <div className="flex justify-between" style={{marginBottom:3}}>
        <span style={{fontSize:11,color:'var(--text-muted)'}}>XP</span>
        <span style={{fontSize:11,color:'var(--text-secondary)'}}>{xp} / {siguiente}</span>
      </div>
      <div className="xp-bar"><div className="xp-fill" style={{width:`${pct*100}%`}}/></div>
    </div>
  )
}

function DiceRoller({oculto=false,personajeNombre='',onResult}) {
  const tirar=useStore(s=>s.tirar)
  const toast=useStore(s=>s.toast)
  const [sel,setSel]=useState([])
  const [mod,setMod]=useState(0)
  const [eta,setEta]=useState('')
  const [rolling,setRolling]=useState(false)
  const [last,setLast]=useState(null)

  const add=caras=>{
    const ex=sel.find(d=>d.caras===caras)
    setSel(ex?sel.map(d=>d.caras===caras?{...d,cantidad:d.cantidad+1}:d):[...sel,{caras,cantidad:1}])
  }
  const clear=()=>{setSel([]);setMod(0);setEta('');setLast(null)}
  const go=()=>{
    if(!sel.length){toast('Elige al menos un dado','warning');return}
    setRolling(true)
    setTimeout(()=>{
      const r=tirar({dados:sel,modificador:parseInt(mod)||0,etiqueta:eta,oculta:oculto,personajeNombre})
      setLast(r); onResult?.(r); setRolling(false)
    },300)
  }

  return (
    <div>
      <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:10}}>
        {DADOS.map(c=>{
          const cnt=sel.find(d=>d.caras===c)?.cantidad||0
          return (
            <button key={c} onClick={()=>add(c)}
              className={`btn btn-sm ${cnt>0?'btn-primary':'btn-ghost'}`}
              style={{position:'relative',minWidth:44}}>
              d{c}
              {cnt>0&&<span style={{position:'absolute',top:-6,right:-6,background:'var(--gold)',color:'#000',borderRadius:'50%',width:16,height:16,fontSize:10,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700}}>{cnt}</span>}
            </button>
          )
        })}
      </div>
      {sel.length>0&&<div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:8}}>
        {sel.map(d=>`${d.cantidad}d${d.caras}`).join('+')}
        {mod!==0&&(mod>0?` +${mod}`:` ${mod}`)}
      </div>}
      <div className="form-row" style={{marginBottom:10}}>
        <div><label>Modificador</label><input type="number" value={mod} onChange={e=>setMod(e.target.value)}/></div>
        <div><label>Etiqueta</label><input value={eta} onChange={e=>setEta(e.target.value)} placeholder="ej: Ataque espada"/></div>
      </div>
      <div className="flex gap-2" style={{marginBottom:last?12:0}}>
        <button className="btn btn-primary flex-1" onClick={go} disabled={rolling}>
          {rolling?'🎲 Tirando...':(oculto?'👁 Tirada oculta':'🎲 Tirar')}
        </button>
        {sel.length>0&&<button className="btn btn-ghost" onClick={clear}>Limpiar</button>}
      </div>
      {last&&(
        <div className={`dice-result ${last.esCritico?'crit':last.esFallo?'fail':''}`} style={{marginTop:10}}>
          <span style={{fontSize:24,fontWeight:700,color:last.esCritico?'var(--gold)':last.esFallo?'var(--red)':'var(--text-primary)'}}>
            {last.total}
          </span>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:'var(--text-muted)'}}>
              [{last.resultados.map(r=>r.valor).join(', ')}]{last.modificador!==0?(last.modificador>0?` +${last.modificador}`:` ${last.modificador}`):''}
            </div>
            {last.esCritico&&<div style={{color:'var(--gold)',fontSize:12,fontWeight:600}}>🌟 ¡ÉXITO CRÍTICO!</div>}
            {last.esFallo&&<div style={{color:'var(--red)',fontSize:12,fontWeight:600}}>💀 FALLO CRÍTICO</div>}
            {last.etiqueta&&<div style={{fontSize:12,color:'var(--text-secondary)'}}>{last.etiqueta}</div>}
          </div>
        </div>
      )}
    </div>
  )
}

function QuickDice({personaje}) {
  const tirar=useStore(s=>s.tirar)
  const [last,setLast]=useState(null)
  const go=(tipo)=>{
    const cfg={
      'ataque-str': {dados:[{cantidad:1,caras:20}],modificador:calcMod(personaje?.str||10),etiqueta:'Ataque (FUE)'},
      'ataque-dex': {dados:[{cantidad:1,caras:20}],modificador:calcMod(personaje?.dex||10),etiqueta:'Ataque (DES)'},
      'prueba':     {dados:[{cantidad:1,caras:20}],modificador:0,etiqueta:'Prueba'},
      'iniciativa': {dados:[{cantidad:1,caras:20}],modificador:calcMod(personaje?.dex||10),etiqueta:'Iniciativa'},
      'salvacion':  {dados:[{cantidad:1,caras:20}],modificador:calcMod(personaje?.con||10),etiqueta:'Salvación'},
    }
    const c=cfg[tipo]; if(!c) return
    const r=tirar({...c,personajeNombre:personaje?.nombre})
    setLast(r)
  }
  return (
    <div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:8}}>
        <button className="btn btn-sm btn-ghost" onClick={()=>go('ataque-str')}>⚔ ATK/FUE</button>
        <button className="btn btn-sm btn-ghost" onClick={()=>go('ataque-dex')}>🏹 ATK/DES</button>
        <button className="btn btn-sm btn-ghost" onClick={()=>go('prueba')}>🎯 Prueba</button>
        <button className="btn btn-sm btn-ghost" onClick={()=>go('iniciativa')}>⚡ Iniciativa</button>
        <button className="btn btn-sm btn-ghost" onClick={()=>go('salvacion')}>🛡 Salvación</button>
      </div>
      {last&&(
        <div className={`dice-result ${last.esCritico?'crit':last.esFallo?'fail':''}`}>
          <span style={{fontSize:20,fontWeight:700,color:last.esCritico?'var(--gold)':last.esFallo?'var(--red)':'var(--text-primary)'}}>{last.total}</span>
          <div>
            <div style={{fontSize:11,color:'var(--text-muted)'}}>[{last.resultados.map(r=>r.valor).join(',')}]{last.modificador!==0?(last.modificador>0?` +${last.modificador}`:` ${last.modificador}`):'  '}</div>
            <div style={{fontSize:12,color:'var(--text-secondary)'}}>{last.etiqueta}</div>
            {last.esCritico&&<div style={{color:'var(--gold)',fontSize:11}}>🌟 ¡Crítico!</div>}
            {last.esFallo&&<div style={{color:'var(--red)',fontSize:11}}>💀 Fallo crítico</div>}
          </div>
        </div>
      )}
    </div>
  )
}

function TiradasHistorial({ocultas=false}) {
  const tiradas=useStore(s=>s.tiradas)
  const vis=ocultas?tiradas:tiradas.filter(t=>!t.oculta)
  if(!vis.length) return <div className="empty-state"><p>Sin tiradas aún</p></div>
  return (
    <div style={{display:'flex',flexDirection:'column',gap:4}}>
      {vis.map(t=>(
        <div key={t.id} className={`dice-result ${t.esCritico?'crit':t.esFallo?'fail':''}`} style={{fontSize:12,padding:'5px 10px'}}>
          {t.oculta&&<span style={{color:'var(--text-muted)'}}>🔒 </span>}
          <span style={{color:'var(--text-muted)',fontSize:11}}>{t.hora}</span>
          <span style={{color:'var(--purple-bright)',marginLeft:6}}>{t.nombre}</span>
          <span style={{marginLeft:6,color:'var(--text-secondary)'}}>{t.etiqueta||t.dados.map(d=>`${d.cantidad}d${d.caras}`).join('+')}:</span>
          <span style={{marginLeft:6,fontWeight:700,color:t.esCritico?'var(--gold)':t.esFallo?'var(--red)':'var(--text-primary)'}}>{t.total}</span>
          {t.esCritico&&<span style={{color:'var(--gold)'}}> 🌟</span>}
          {t.esFallo&&<span style={{color:'var(--red)'}}> 💀</span>}
        </div>
      ))}
    </div>
  )
}

function LogPartida() {
  const log=useStore(s=>s.log)
  return (
    <div style={{maxHeight:260,overflowY:'auto'}}>
      {!log.length?<div className="empty-state"><p>Log vacío</p></div>:
        log.map(e=>(
          <div key={e.id} className="log-entry">
            <span className="log-time">{e.hora}</span>
            <span dangerouslySetInnerHTML={{__html:e.mensaje.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}}/>
          </div>
        ))
      }
    </div>

function Confirm({mensaje,onConfirm,onCancel}) {
  return (
    <Modal titulo="Confirmar acción" onClose={onCancel} size="modal-sm">
      <p style={{marginBottom:16,color:'var(--text-secondary)'}}>{mensaje}</p>
      <div className="modal-actions">
        <button className="btn btn-ghost" onClick={onCancel}>Cancelar</button>
        <button className="btn btn-danger" onClick={onConfirm}>Confirmar</button>
      </div>
    </Modal>
  )
}

function NumberInput({value,onChange,min=0,max=9999,label}) {
  return (
    <div>
      {label&&<label>{label}</label>}
      <div className="num-input-wrap">
        <button className="btn btn-ghost btn-sm btn-icon" onClick={()=>onChange(Math.max(min,value-1))}>−</button>
        <input type="number" value={value} min={min} max={max}
          onChange={e=>onChange(Math.max(min,Math.min(max,parseInt(e.target.value)||0)))}/>
        <button className="btn btn-ghost btn-sm btn-icon" onClick={()=>onChange(Math.min(max,value+1))}>+</button>
      </div>
    </div>
  )
}

function Portrait({src,nombre,size=48,emoji='⚔️'}) {
  const [err,setErr]=useState(false)
  if(src&&!err) return (
    <img src={src} alt={nombre} onError={()=>setErr(true)}
      style={{width:size,height:size,borderRadius:6,objectFit:'cover',flexShrink:0}}/>
  )
  return (
    <div style={{width:size,height:size,borderRadius:6,background:'var(--purple-dim)',display:'flex',
      alignItems:'center',justifyContent:'center',fontSize:size*0.45,flexShrink:0}}>
      {emoji}
    </div>
  )
}

function StatGrid({personaje,editable=false,onChange}) {
  const stats=[

function PantallaAuth() {
  const [modo, setModo] = useState('login')
  const login    = useStore(s => s.login)
  const registrar= useStore(s => s.registrar)
  const [email,    setEmail]    = useState('')
  const [password, setPassword] = useState('')
  const [nombre,   setNombre]   = useState('')
  const [rol,      setRol]      = useState('jugador')
  const [loading,  setLoading]  = useState(false)

  const handleSubmit = e => {
    e.preventDefault()
    setLoading(true)
    setTimeout(() => {
      if (modo === 'login') login(email, password, rol)
      else { if (nombre.trim()) registrar(email, password, rol, nombre) }
      setLoading(false)
    }, 250)
  }

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',
      justifyContent:'center',padding:16,background:'var(--bg-primary)'}}>

      {/* Logo */}
      <div style={{textAlign:'center',marginBottom:32}}>
        <div style={{fontSize:52,marginBottom:8}}>⚔️</div>
        <h1 style={{fontSize:28,fontWeight:700,color:'var(--gold)',letterSpacing:3,margin:0}}>
          CHASING ADVENTURE
        </h1>
        <p style={{color:'var(--text-muted)',fontSize:13,marginTop:6}}>
          Sistema de gestión de partidas de rol · Gratuito
        </p>
      </div>

      {/* Tarjeta */}
      <div className="card" style={{width:'100%',maxWidth:420}}>
        <div className="tabs" style={{marginBottom:16}}>
          <button className={`tab ${modo==='login'?'active':''}`} onClick={()=>setModo('login')}>
            Iniciar sesión
          </button>
          <button className={`tab ${modo==='registro'?'active':''}`} onClick={()=>setModo('registro')}>
            Crear cuenta
          </button>
        </div>

        <form onSubmit={handleSubmit}>
          {modo==='registro' && (
            <div className="form-group">
              <label>Nombre de usuario</label>
              <input type="text" value={nombre} onChange={e=>setNombre(e.target.value)}
                placeholder="Tu nombre en la aventura" required autoFocus/>
            </div>
          )}
          <div className="form-group">
            <label>Email</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
              placeholder="tu@email.com" required autoFocus={modo==='login'}/>
          </div>
          <div className="form-group">
            <label>Contraseña</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)}
              placeholder="••••••••" required minLength={4}/>
          </div>

          {/* Selector de rol */}
          <div className="form-group">
            <label>Rol</label>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginTop:4}}>
              {[
                {id:'dj',     emoji:'🎭', titulo:'Director de Juego', sub:'Crea y dirige partidas'},
                {id:'jugador',emoji:'🧙', titulo:'Jugador',           sub:'Vive la aventura'},
              ].map(r => (
                <button key={r.id} type="button" onClick={()=>setRol(r.id)}
                  className={`btn ${rol===r.id?(r.id==='dj'?'btn-gold':'btn-primary'):'btn-ghost'}`}
                  style={{flexDirection:'column',padding:'12px 8px',height:'auto',gap:4}}>
                  <span style={{fontSize:24}}>{r.emoji}</span>
                  <span style={{fontSize:12,fontWeight:700}}>{r.titulo}</span>
                  <span style={{fontSize:10,fontWeight:400,opacity:.75}}>{r.sub}</span>
                </button>
              ))}
            </div>
          </div>

          <button type="submit" className="btn btn-primary" style={{width:'100%',marginTop:4}} disabled={loading}>
            {loading ? '⏳ Cargando...' : modo==='login' ? '→ Entrar' : '✨ Crear cuenta'}
          </button>
        </form>

        <div style={{marginTop:12,padding:10,background:'var(--bg-secondary)',borderRadius:'var(--radius)',
          fontSize:12,color:'var(--text-muted)'}}>
          💡 <strong style={{color:'var(--text-secondary)'}}>Sin servidor:</strong> Todos los datos se guardan
          localmente en tu navegador. Comparte el código de partida con tus jugadores en persona.
        </div>
      </div>

      <p style={{marginTop:20,fontSize:11,color:'var(--text-muted)',textAlign:'center'}}>
        Sistema propio "Chasing Adventure" · Sin licencias externas · Código abierto
      </p>
    </div>
  )
}

function PantallaLobby() {
  const usuarioActual = useStore(s => s.usuarioActual)
  const partidas      = useStore(s => s.partidas)
  const logout        = useStore(s => s.logout)
  const crearPartida  = useStore(s => s.crearPartida)
  const unirseAPartida= useStore(s => s.unirseAPartida)
  const cargarPartida = useStore(s => s.cargarPartida)

  const [nombrePartida, setNombrePartida] = useState('')
  const [codigo,  setCodigo]  = useState('')
  const [creando, setCreando] = useState(false)

  const esDJ = usuarioActual?.rol === 'dj'

  const misPartidas = esDJ
    ? partidas.filter(p => p.djId === usuarioActual.id)
    : partidas.filter(p => p.jugadores?.includes(usuarioActual.id))

  const handleCrear = e => {
    e.preventDefault()
    if (!nombrePartida.trim()) return
    crearPartida(nombrePartida.trim())
    setNombrePartida(''); setCreando(false)
  }
  const handleUnirse = e => {
    e.preventDefault()
    if (!codigo.trim()) return
    unirseAPartida(codigo.trim())
    setCodigo('')
  }

  const estadoColor = {lobby:'var(--blue)',activa:'var(--green)',pausada:'var(--orange)',finalizada:'var(--text-muted)'}
  const estadoLabel = {lobby:'⏳ En espera',activa:'⚔️ En curso',pausada:'⏸ Pausada',finalizada:'✓ Finalizada'}

  return (
    <div style={{minHeight:'100vh',background:'var(--bg-primary)'}}>
      {/* Header */}
      <header style={{background:'var(--bg-secondary)',borderBottom:'1px solid var(--border)',
        padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontSize:24}}>⚔️</span>
          <div>
            <div style={{fontWeight:700,fontSize:16,color:'var(--gold)'}}>Chasing Adventure</div>
            <div style={{fontSize:12,color:'var(--text-muted)'}}>
              {esDJ?'🎭 Director de Juego':'🧙 Jugador'} · {usuarioActual?.nombre}
            </div>
          </div>
        </div>
        <button className="btn btn-ghost btn-sm" onClick={logout}>Cerrar sesión</button>
      </header>

      <div style={{maxWidth:800,margin:'0 auto',padding:'24px 16px'}}>

        {/* Acción principal */}
        {esDJ ? (
          <div className="card" style={{marginBottom:24}}>
            <div className="card-title">🎲 Nueva Partida</div>
            {!creando ? (
              <button className="btn btn-gold" style={{width:'100%'}} onClick={()=>setCreando(true)}>
                + Crear nueva partida
              </button>
            ) : (
              <form onSubmit={handleCrear}>
                <div className="form-group">
                  <label>Nombre de la partida</label>
                  <input type="text" value={nombrePartida} onChange={e=>setNombrePartida(e.target.value)}
                    placeholder="ej: La Maldición del Castillo Draken" autoFocus required/>
                </div>
                <div className="flex gap-2">
                  <button type="submit" className="btn btn-gold flex-1">Crear</button>
                  <button type="button" className="btn btn-ghost" onClick={()=>setCreando(false)}>Cancelar</button>
                </div>
              </form>
            )}
          </div>
        ) : (
          <div className="card" style={{marginBottom:24}}>
            <div className="card-title">🚪 Unirse a partida</div>
            <form onSubmit={handleUnirse}>
              <div className="form-group">
                <label>Código de partida (6 caracteres)</label>
                <input type="text" value={codigo} onChange={e=>setCodigo(e.target.value.toUpperCase())}
                  placeholder="ej: X7K9P2" maxLength={6}
                  style={{letterSpacing:8,textAlign:'center',fontSize:22,fontWeight:700}}/>
              </div>
              <button type="submit" className="btn btn-primary" style={{width:'100%'}}>
                Unirse →
              </button>
            </form>
          </div>
        )}

        {/* Lista de partidas */}
        <div className="section-header">
          {esDJ ? 'Mis partidas' : 'Partidas en las que participas'}
        </div>

        {!misPartidas.length ? (
          <div className="empty-state">
            <div className="icon">{esDJ?'🎭':'🧙'}</div>
            <p>{esDJ?'Aún no has creado ninguna partida':'Aún no te has unido a ninguna partida'}</p>
          </div>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {[...misPartidas].reverse().map(partida => (
              <div key={partida.id} className="card" style={{cursor:'pointer'}}
                onClick={()=>cargarPartida(partida.id)}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:600,fontSize:15,marginBottom:4}}>{partida.nombre}</div>
                    <div style={{display:'flex',gap:12,fontSize:12,color:'var(--text-secondary)',flexWrap:'wrap'}}>
                      {esDJ && (
                        <>
                          <span style={{fontFamily:'monospace',letterSpacing:3,color:'var(--gold)',fontWeight:700}}>
                            {partida.codigo}
                          </span>
                          <span>👥 {partida.jugadores?.length||0} jugadores</span>
                        </>
                      )}
                      <span>📅 {new Date(partida.creadaEn).toLocaleDateString('es')}</span>
                    </div>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6,marginLeft:12}}>
                    <span style={{fontSize:12,fontWeight:600,color:estadoColor[partida.estado]}}>
                      {estadoLabel[partida.estado]}
                    </span>
                    <button className="btn btn-primary btn-sm"
                      onClick={e=>{e.stopPropagation();cargarPartida(partida.id)}}>
                      {esDJ?'Dirigir →':'Entrar →'}
                    </button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}

        {/* Tip */}
        <div style={{marginTop:24,padding:12,background:'var(--bg-secondary)',borderRadius:'var(--radius)',
          fontSize:12,color:'var(--text-muted)'}}>
          {esDJ
            ? '💡 Crea una partida y comparte el código de 6 caracteres con tus jugadores presencialmente o por WhatsApp.'
            : '💡 Pide el código de 6 caracteres al Director de Juego para unirte a su partida.'}
        </div>
      </div>
    </div>
  )
}

            <button className="btn btn-success" onClick={()=>{finalizarCombate(xpVal);setShowXP(false)}}>✓ Confirmar</button>
          </div>
        </Modal>
      )}
    </div>
  )
}

// ─── Tab Escena ───────────────────────────────────────────────────────────────
function TabEscena() {
  const {partidaActiva,crearEscena,activarEscena,eliminarEscena,actualizarPartida}=useStore(s=>({
    partidaActiva:s.partidaActiva,crearEscena:s.crearEscena,
    activarEscena:s.activarEscena,eliminarEscena:s.eliminarEscena,
    actualizarPartida:s.actualizarPartida,
  }))
  const [showForm,setShowForm]=useState(false)
  const [editId,setEditId]=useState(null)
  const [form,setForm]=useState({titulo:'',descripcion:'',imagen:'',tipo:'Exploración'})
  const [del,setDel]=useState(null)
  const escenas=partidaActiva?.escenas||[]
  const actual=escenas.find(e=>e.id===partidaActiva?.escenaActualId)

  const reset=()=>setForm({titulo:'',descripcion:'',imagen:'',tipo:'Exploración'})
  const save=()=>{
    if(!form.titulo.trim()) return
    if(editId){
      actualizarPartida({escenas:escenas.map(e=>e.id===editId?{...e,...form}:e)})
    } else { crearEscena(form) }
    setShowForm(false); setEditId(null); reset()
  }
  const edit=e=>{setForm({titulo:e.titulo,descripcion:e.descripcion,imagen:e.imagen||'',tipo:e.tipo});setEditId(e.id);setShowForm(true)}

  return (
    <div>
      {actual&&(
        <div className="card" style={{marginBottom:16,borderLeft:'3px solid var(--gold)'}}>
          {actual.imagen&&<img src={actual.imagen} alt="" onError={e=>e.target.style.display='none'}
            style={{width:'100%',height:140,objectFit:'cover',borderRadius:6,marginBottom:10}}/>}
          <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:6}}>
            <BadgeEscena tipo={actual.tipo}/>
            <span style={{fontWeight:700,fontSize:16}}>{actual.titulo}</span>
            <div className="pulse-dot" style={{marginLeft:'auto'}}/>
          </div>
          <p style={{fontSize:13,color:'var(--text-secondary)',lineHeight:1.7}}>{actual.descripcion}</p>
        </div>
      )}
      <div className="flex justify-between items-center mb-3">
        <div className="section-header" style={{margin:0}}>Escenas preparadas ({escenas.length})</div>
        <button className="btn btn-primary btn-sm" onClick={()=>{reset();setEditId(null);setShowForm(true)}}>+ Nueva</button>
      </div>
      {!escenas.length?<div className="empty-state"><div className="icon">🗺</div><p>Sin escenas preparadas</p></div>:(
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {escenas.map(esc=>(
            <div key={esc.id} className="card" style={{padding:'10px 12px',borderLeft:`3px solid ${esc.id===actual?.id?'var(--gold)':'transparent'}`}}>
              <div className="flex items-center gap-2">
                <BadgeEscena tipo={esc.tipo}/>
                <span style={{flex:1,fontWeight:500,fontSize:13}}>{esc.titulo}</span>
                <button className="btn btn-success btn-sm" onClick={()=>activarEscena(esc.id)}>▶ Activar</button>
                <button className="btn btn-ghost btn-sm btn-icon" onClick={()=>edit(esc)}>✏</button>
                <button className="btn btn-danger btn-sm btn-icon" onClick={()=>setDel(esc.id)}>✕</button>
              </div>
              {esc.descripcion&&<p style={{fontSize:12,color:'var(--text-muted)',marginTop:6}}>{esc.descripcion.slice(0,100)}{esc.descripcion.length>100?'…':''}</p>}
            </div>
          ))}
        </div>
      )}
      {showForm&&(
        <Modal titulo={editId?'✏ Editar escena':'+ Nueva escena'} onClose={()=>{setShowForm(false);setEditId(null);reset()}}>
          <div className="form-group"><label>Título</label><input value={form.titulo} onChange={e=>setForm(f=>({...f,titulo:e.target.value}))} autoFocus/></div>
          <div className="form-group"><label>Descripción (visible para jugadores)</label><textarea rows={4} value={form.descripcion} onChange={e=>setForm(f=>({...f,descripcion:e.target.value}))} style={{resize:'vertical'}}/></div>
          <div className="form-group"><label>URL imagen de fondo</label><input value={form.imagen} onChange={e=>setForm(f=>({...f,imagen:e.target.value}))} placeholder="https://..."/></div>
          <div className="form-group"><label>Tipo</label><select value={form.tipo} onChange={e=>setForm(f=>({...f,tipo:e.target.value}))}>{TIPOS_ESCENA.map(t=><option key={t}>{t}</option>)}</select></div>
          <div className="modal-actions">
            <button className="btn btn-ghost" onClick={()=>{setShowForm(false);setEditId(null);reset()}}>Cancelar</button>
            <button className="btn btn-primary" onClick={save}>Guardar</button>
          </div>
        </Modal>
      )}
      {del&&<Confirm mensaje="¿Eliminar esta escena?" onConfirm={()=>{eliminarEscena(del);setDel(null)}} onCancel={()=>setDel(null)}/>}
    </div>
  )
}

// ─── Tab Jugadores ────────────────────────────────────────────────────────────
function TabJugadores() {
  const {partidaActiva,personajes,usuarios,clases,estadosDisponibles,
    aplicarDañoPersonaje,curarPersonaje,ganarXP,actualizarPersonaje,
    aplicarEstado,quitarEstado,transferirObjeto,agregarAlInventario,quitarDelInventario}=useStore(s=>s)
  const [editId,setEditId]=useState(null)
  const [transferModal,setTransferModal]=useState(null)

  const jugadores=(partidaActiva?.jugadores||[]).map(id=>({
    usuario:usuarios.find(u=>u.id===id),
    personaje:personajes.find(p=>p.usuarioId===id&&p.gameId===partidaActiva.id)
  })).filter(j=>j.usuario)

  return (
    <div>
      <div className="section-header">Jugadores ({jugadores.length}) · Código: <strong style={{color:'var(--gold)',letterSpacing:3}}>{partidaActiva?.codigo}</strong></div>
      {!jugadores.length?<div className="empty-state"><div className="icon">👥</div><p>Ningún jugador se ha unido todavía</p></div>:(
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          {jugadores.map(({usuario,personaje})=>(
            <JugadorCardDJ key={usuario.id} usuario={usuario} personaje={personaje} clases={clases}
              estadosDisponibles={estadosDisponibles}
              onDaño={(pid,c)=>aplicarDañoPersonaje(pid,c)}
              onCura={(pid,c)=>curarPersonaje(pid,c)}
              onXP={(pid,c)=>ganarXP(pid,c)}
              onUpdate={(pid,cambios)=>actualizarPersonaje(pid,cambios)}
              onAplicarEstado={(pid,eid)=>aplicarEstado(pid,eid)}
              onQuitarEstado={(pid,eid)=>quitarEstado(pid,eid)}
              onTransferir={(pid)=>setTransferModal(pid)}
              onAddItem={(pid,item)=>agregarAlInventario(pid,item)}
              onRemoveItem={(pid,iid)=>quitarDelInventario(pid,iid)}
              todosPersonajes={personajes.filter(p=>p.gameId===partidaActiva.id)}
            />
          ))}
        </div>
      )}
      {transferModal&&(
        <TransferModal fromPid={transferModal} personajes={personajes.filter(p=>p.gameId===partidaActiva.id)}
          onTransfer={(fromPid,toPid,iid,cant)=>{transferirObjeto(fromPid,toPid,iid,cant);setTransferModal(null)}}
          onClose={()=>setTransferModal(null)}/>
      )}
    </div>
  )
}

function JugadorCardDJ({usuario,personaje,clases,estadosDisponibles,onDaño,onCura,onXP,onUpdate,onAplicarEstado,onQuitarEstado,onTransferir,onAddItem,onRemoveItem,todosPersonajes}) {
  const [exp,setExp]=useState(false)
  const [subTab,setSubTab]=useState('stats')
  const [cant,setCant]=useState(0)

    <div className="card" style={{padding:'10px 12px'}}>

        <Portrait nombre={usuario.nombre} size={36}/>
        <div><div style={{fontWeight:600}}>{usuario.nombre}</div><div style={{fontSize:12,color:'var(--text-muted)'}}>Sin personaje</div></div>
      </div>

  )

  return (
    <div className="card">
      <div className="flex gap-2 items-center" style={{marginBottom:8}}>

        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:600,fontSize:14}}>{personaje.nombre}</div>
          <div style={{fontSize:12,color:'var(--text-muted)'}}>{clase?.nombre} · Nv.{personaje.nivel} · {usuario.nombre}</div>
          {(personaje.estados||[]).length>0&&(
            <div style={{display:'flex',flexWrap:'wrap',gap:2,marginTop:4}}>
              {personaje.estados.map(e=><EstadoChip key={e.id} estado={e} onRemove={()=>onQuitarEstado(personaje.id,e.id)}/>)}

          )}
        </div>

          <div style={{fontWeight:700,fontSize:15}}>{personaje.vidaActual}<span style={{color:'var(--text-muted)',fontWeight:400}}>/{personaje.vidaMax}</span></div>

              {/* Recursos de clase */}

          {subTab==='acciones'&&(
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <div style={{background:'var(--bg-secondary)',borderRadius:'var(--radius)',padding:10}}>

                </div>
              </div>
              <div style={{background:'var(--bg-secondary)',borderRadius:'var(--radius)',padding:10}}>
                <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:8,fontWeight:700,textTransform:'uppercase',letterSpacing:1}}>XP y Nivel</div>
                <div className="flex gap-2 items-center" style={{flexWrap:'wrap'}}>
                  <input type="number" min={0} value={xp} onChange={e=>setXp(parseInt(e.target.value)||0)} style={{width:72}} placeholder="XP"/>

                <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:8,fontWeight:700,textTransform:'uppercase',letterSpacing:1}}>Oro</div>
                <div className="flex gap-2 items-center" style={{flexWrap:'wrap'}}>
                  <input type="number" min={0} value={personaje.oro} onChange={e=>onUpdate(personaje.id,{oro:parseInt(e.target.value)||0})} style={{width:90}}/>
                  <span style={{fontSize:12,color:'var(--text-muted)'}}>🪙</span>
                </div>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  )
}

  const addArmaRapida=a=>{onAdd({nombre:a.nombre,descripcion:`${a.dadoCantidad}d${a.dadoCaras}${a.modificador?`+${a.modificador}`:''}`,cantidad:1,tipo:'arma',icono:a.icono||'⚔️',apilable:false,dadoCantidad:a.dadoCantidad,dadoCaras:a.dadoCaras,modificador:a.modificador});setShowAdd(false)}

  return (
    <div>
      <div className="flex justify-between items-center mb-2">
        <span style={{fontSize:12,color:'var(--text-muted)'}}>{inv.length} objetos · 🪙 {personaje.oro}</span>

        </div>
      </div>
      {!inv.length?<div style={{fontSize:12,color:'var(--text-muted)',textAlign:'center',padding:12}}>Inventario vacío</div>:(
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          {inv.map(item=>(
            <div key={item.id} className="inv-item" style={{padding:'6px 10px'}}>
              <div className="flex gap-2 items-center flex-1">
                <span>{emojis[item.tipo]||'📦'}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:500}}>{item.nombre}</div>
                  {item.descripcion&&<div style={{fontSize:11,color:'var(--text-muted)'}}>{item.descripcion}</div>}
                </div>
              </div>
              <div className="flex gap-2 items-center">
                <span className="badge badge-gray">×{item.cantidad}</span>
                <button className="btn btn-danger btn-sm btn-icon" onClick={()=>onRemove(item.id)}>✕</button>
              </div>

      )}
      {showAdd&&(
        <Modal titulo="+ Añadir objeto" onClose={()=>setShowAdd(false)}>

            <button className="tab active">Manual</button>

        </Modal>
      )}
    </div>
  )
