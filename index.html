function TransferModal({fromPid,personajes,onTransfer,onClose}) {
  const from=personajes.find(p=>p.id===fromPid)
  const [toPid,setToPid]=useState('')
  const [itemId,setItemId]=useState('')
  const [cant,setCant]=useState(1)
  if(!from) return null
  const inv=from.inventario||[]
  const item=inv.find(i=>i.id===itemId)
  return (
    <Modal titulo="↔ Transferir objeto" onClose={onClose} size="modal-sm">
      <div className="form-group"><label>Objeto de {from.nombre}</label>
        <select value={itemId} onChange={e=>setItemId(e.target.value)}>
          <option value="">-- Seleccionar --</option>
          {inv.map(i=><option key={i.id} value={i.id}>{i.nombre} (×{i.cantidad})</option>)}
        </select>
      </div>
      <div className="form-group"><label>Destino</label>
        <select value={toPid} onChange={e=>setToPid(e.target.value)}>
          <option value="">-- Seleccionar --</option>
          {personajes.filter(p=>p.id!==fromPid).map(p=><option key={p.id} value={p.id}>{p.nombre}</option>)}
        </select>
      </div>
      {item&&<div className="form-group"><label>Cantidad (max {item.cantidad})</label>
        <input type="number" min={1} max={item.cantidad} value={cant} onChange={e=>setCant(parseInt(e.target.value)||1)}/>
      </div>}
      <div className="modal-actions">
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!itemId||!toPid}
          onClick={()=>onTransfer(fromPid,toPid,itemId,cant)}>Transferir</button>
      </div>
    </Modal>
  )
}

// ─── Tab Enemigos ─────────────────────────────────────────────────────────────
function TabEnemigos() {
  const {enemigos,usuarioActual,crearEnemigo,eliminarEnemigo,
    añadirEnemigoACombate,dañarEnemigoCombate,curarEnemigoCombate,
    eliminarEnemigoCombate,combateActivo,partidaActiva}=useStore(s=>s)
  const [subTab,setSubTab]=useState('biblioteca')
  const [showForm,setShowForm]=useState(false)
  const [form,setForm]=useState({nombre:'',vidaMax:20,ataque:5,defensa:12,dadosDaño:'1d8',habilidades:'',tipo:'normal'})
  const [del,setDel]=useState(null)
  const [cants,setCants]=useState({})
  const mis=enemigos.filter(e=>e.creadoPor===usuarioActual.id||e.creadoPor==='system')
  const enCombate=partidaActiva?.enemigosEnCombate||[]

  const save=()=>{
    if(!form.nombre.trim()) return
    crearEnemigo({...form,vidaMax:parseInt(form.vidaMax)||20,ataque:parseInt(form.ataque)||5,defensa:parseInt(form.defensa)||12})
    setShowForm(false); setForm({nombre:'',vidaMax:20,ataque:5,defensa:12,dadosDaño:'1d8',habilidades:'',tipo:'normal'})
  }
  return (
    <div>
      <div className="tabs">
        <button className={`tab ${subTab==='biblioteca'?'active':''}`} onClick={()=>setSubTab('biblioteca')}>📚 Biblioteca</button>
        <button className={`tab ${subTab==='combate'?'active':''}`} onClick={()=>setSubTab('combate')}>⚔️ Combate {enCombate.length>0&&`(${enCombate.length})`}</button>
      </div>
      {subTab==='biblioteca'&&(
        <div>
          <div className="flex justify-end mb-3"><button className="btn btn-primary btn-sm" onClick={()=>setShowForm(true)}>+ Nuevo</button></div>
          {!mis.length?<div className="empty-state"><div className="icon">💀</div><p>Sin enemigos</p></div>:(
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {mis.map(e=>(
                <div key={e.id} className="card" style={{padding:'10px 12px'}}>
                  <div className="flex items-center gap-2">
                    <div style={{flex:1}}>
                      <div className="flex gap-2 items-center mb-1">
                        <span style={{fontWeight:600,fontSize:13}}>{e.nombre}</span>
                        <BadgeTipoEnemigo tipo={e.tipo}/>
                      </div>
                      <div style={{fontSize:12,color:'var(--text-muted)'}}>❤ {e.vidaMax} · ⚔ {e.ataque} · 🛡 {e.defensa} · 🎲 {e.dadosDaño}</div>
                      {e.habilidades&&<div style={{fontSize:11,color:'var(--text-secondary)',marginTop:3}}>🔮 {e.habilidades}</div>}
                    </div>
                    <button className="btn btn-gold btn-sm" onClick={()=>{añadirEnemigoACombate(e.id);setSubTab('combate')}} disabled={!combateActivo} title={!combateActivo?'Inicia el combate primero':''}>+ Combate</button>
                    <button className="btn btn-danger btn-sm btn-icon" onClick={()=>setDel(e.id)}>✕</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
      {subTab==='combate'&&(
        <div>
          {!enCombate.length?<div className="empty-state"><div className="icon">⚔️</div><p>Sin enemigos en combate</p><p style={{marginTop:4,fontSize:12}}>Añade desde Biblioteca</p></div>:(
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {enCombate.map(e=>(
                <div key={e.instanciaId} className="card" style={{opacity:e.derrotado?0.5:1}}>
                  <div className="flex gap-2 items-center mb-2">
                    <div style={{flex:1}}>
                      <div className="flex gap-2 items-center">
                        <span style={{fontWeight:600}}>{e.nombre}</span>
                        <BadgeTipoEnemigo tipo={e.tipo}/>
                        {e.derrotado&&<span style={{color:'var(--red)',fontSize:12}}>💀 Derrotado</span>}
                      </div>
                    </div>
                    <button className="btn btn-ghost btn-sm btn-icon" onClick={()=>eliminarEnemigoCombate(e.instanciaId)}>✕</button>
                  </div>
                  <HPBar actual={e.vidaActual} max={e.vidaMax}/>
                  {!e.derrotado&&(
                    <div className="flex gap-2" style={{marginTop:8,flexWrap:'wrap'}}>
                      <input type="number" min={0} value={cants[e.instanciaId]||''} onChange={ev=>setCants(c=>({...c,[e.instanciaId]:parseInt(ev.target.value)||0}))} placeholder="Cant." style={{width:70}}/>
                      <button className="btn btn-danger btn-sm" onClick={()=>dañarEnemigoCombate(e.instanciaId,cants[e.instanciaId]||0)}>⚔ Dañar</button>
                      <button className="btn btn-success btn-sm" onClick={()=>curarEnemigoCombate(e.instanciaId,cants[e.instanciaId]||0)}>💚 Curar</button>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      )}
      {showForm&&(
        <Modal titulo="+ Nuevo enemigo" onClose={()=>setShowForm(false)}>
          <div className="form-group"><label>Nombre</label><input value={form.nombre} onChange={e=>setForm(f=>({...f,nombre:e.target.value}))} autoFocus/></div>
          <div className="form-row">
            <div className="form-group"><label>Vida máx</label><input type="number" value={form.vidaMax} onChange={e=>setForm(f=>({...f,vidaMax:e.target.value}))}/></div>
            <div className="form-group"><label>Tipo</label><select value={form.tipo} onChange={e=>setForm(f=>({...f,tipo:e.target.value}))}><option value="normal">Normal</option><option value="mini">Mini-Jefe</option><option value="boss">Jefe Final</option></select></div>
          </div>
          <div className="form-row-3">
            <div className="form-group"><label>Ataque</label><input type="number" value={form.ataque} onChange={e=>setForm(f=>({...f,ataque:e.target.value}))}/></div>
            <div className="form-group"><label>Defensa</label><input type="number" value={form.defensa} onChange={e=>setForm(f=>({...f,defensa:e.target.value}))}/></div>
            <div className="form-group"><label>Daño</label><input value={form.dadosDaño} onChange={e=>setForm(f=>({...f,dadosDaño:e.target.value}))} placeholder="1d8+2"/></div>
          </div>
          <div className="form-group"><label>Habilidades</label><textarea rows={2} value={form.habilidades} onChange={e=>setForm(f=>({...f,habilidades:e.target.value}))} style={{resize:'vertical'}}/></div>
          <div className="modal-actions">
            <button className="btn btn-ghost" onClick={()=>setShowForm(false)}>Cancelar</button>
            <button className="btn btn-primary" onClick={save}>Guardar</button>
          </div>
        </Modal>
      )}
      {del&&<Confirm mensaje="¿Eliminar este enemigo?" onConfirm={()=>{eliminarEnemigo(del);setDel(null)}} onCancel={()=>setDel(null)}/>}
    </div>
  )
}

// ─── Tab PNJ ──────────────────────────────────────────────────────────────────
function TabPNJ() {
  const {pnjs,usuarioActual,crearPnj,actualizarPnj,eliminarPnj,invocarPnjEnPartida}=useStore(s=>s)
  const [showForm,setShowForm]=useState(false)
  const [editId,setEditId]=useState(null)
  const [form,setForm]=useState({nombre:'',imagen:'',descripcion:'',nivelAmistad:50,estadoEmocional:'Neutral'})
  const [del,setDel]=useState(null)
  const mis=pnjs.filter(p=>p.creadoPor===usuarioActual.id||p.creadoPor==='system')
  const emo={Enfadado:'😠',Triste:'😢',Neutral:'😐',Contento:'😊',Eufórico:'😄',Miedoso:'😨'}
  const save=()=>{
    if(!form.nombre.trim()) return
    editId?actualizarPnj(editId,form):crearPnj(form)
    setShowForm(false); setEditId(null); setForm({nombre:'',imagen:'',descripcion:'',nivelAmistad:50,estadoEmocional:'Neutral'})
  }
  const edit=p=>{setForm({nombre:p.nombre,imagen:p.imagen||'',descripcion:p.descripcion,nivelAmistad:p.nivelAmistad,estadoEmocional:p.estadoEmocional});setEditId(p.id);setShowForm(true)}
  return (
    <div>
      <div className="flex justify-end mb-3"><button className="btn btn-primary btn-sm" onClick={()=>{setEditId(null);setShowForm(true)}}>+ Nuevo</button></div>
      {!mis.length?<div className="empty-state"><div className="icon">🗣</div><p>Sin PNJs</p></div>:(
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {mis.map(p=>(
            <div key={p.id} className="card">
              <div className="flex gap-2 items-start">
                <Portrait src={p.imagen} nombre={p.nombre} size={44} emoji="🗣"/>
                <div style={{flex:1,minWidth:0}}>
                  <div className="flex gap-2 items-center mb-1">
                    <span style={{fontWeight:600}}>{p.nombre}</span>
                    <BadgeAfinidad afinidad={p.afinidad}/>
                    <span title={p.estadoEmocional}>{emo[p.estadoEmocional]||'😐'}</span>
                  </div>
                  <div style={{marginBottom:4}}>
                    <div className="flex justify-between" style={{fontSize:11,color:'var(--text-muted)',marginBottom:2}}>
                      <span>Amistad</span><span>{p.nivelAmistad}/100</span>
                    </div>
                    <div className="hp-bar" style={{height:6}}>
                      <div style={{width:`${p.nivelAmistad}%`,height:'100%',borderRadius:3,
                        background:p.nivelAmistad>60?'var(--green)':p.nivelAmistad>40?'var(--blue)':p.nivelAmistad>20?'var(--orange)':'var(--red)',transition:'width .3s'}}/>
                    </div>
                  </div>
                  {p.descripcion&&<p style={{fontSize:12,color:'var(--text-muted)'}}>{p.descripcion.slice(0,80)}{p.descripcion.length>80?'…':''}</p>}
                  <div className="flex gap-2 mt-2" style={{flexWrap:'wrap'}}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>actualizarPnj(p.id,{nivelAmistad:Math.max(0,p.nivelAmistad-10)})}>−10</button>
                    <button className="btn btn-ghost btn-sm" onClick={()=>actualizarPnj(p.id,{nivelAmistad:Math.max(0,p.nivelAmistad-5)})}>−5</button>
                    <button className="btn btn-ghost btn-sm" onClick={()=>actualizarPnj(p.id,{nivelAmistad:Math.min(100,p.nivelAmistad+5)})}>+5</button>
                    <button className="btn btn-ghost btn-sm" onClick={()=>actualizarPnj(p.id,{nivelAmistad:Math.min(100,p.nivelAmistad+10)})}>+10</button>
                    <select value={p.estadoEmocional} onChange={e=>actualizarPnj(p.id,{estadoEmocional:e.target.value})} style={{width:'auto',fontSize:12,padding:'4px 8px'}}>
                      {ESTADOS_EMOCIONALES.map(e=><option key={e}>{e}</option>)}
                    </select>
                  </div>
                </div>
                <div className="flex flex-col gap-2">
                  <button className="btn btn-ghost btn-sm btn-icon" onClick={()=>edit(p)}>✏</button>
                  <button className="btn btn-gold btn-sm btn-icon" onClick={()=>invocarPnjEnPartida(p.id)} title="Invocar">📍</button>
                  <button className="btn btn-danger btn-sm btn-icon" onClick={()=>setDel(p.id)}>✕</button>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
      {showForm&&(
        <Modal titulo={editId?'✏ Editar PNJ':'+ Nuevo PNJ'} onClose={()=>{setShowForm(false);setEditId(null)}}>
          <div className="form-group"><label>Nombre</label><input value={form.nombre} onChange={e=>setForm(f=>({...f,nombre:e.target.value}))} autoFocus/></div>
          <div className="form-group"><label>URL imagen</label><input value={form.imagen} onChange={e=>setForm(f=>({...f,imagen:e.target.value}))} placeholder="https://..."/></div>
          <div className="form-group"><label>Descripción</label><textarea rows={3} value={form.descripcion} onChange={e=>setForm(f=>({...f,descripcion:e.target.value}))} style={{resize:'vertical'}}/></div>
          <div className="form-row">
            <div className="form-group"><label>Amistad: {form.nivelAmistad}</label><input type="range" min={0} max={100} value={form.nivelAmistad} onChange={e=>setForm(f=>({...f,nivelAmistad:parseInt(e.target.value)}))} style={{background:'none',border:'none',padding:0,width:'100%',cursor:'pointer'}}/></div>
            <div className="form-group"><label>Estado emocional</label><select value={form.estadoEmocional} onChange={e=>setForm(f=>({...f,estadoEmocional:e.target.value}))}>{ESTADOS_EMOCIONALES.map(e=><option key={e}>{e}</option>)}</select></div>
          </div>
          <div className="modal-actions">
            <button className="btn btn-ghost" onClick={()=>{setShowForm(false);setEditId(null)}}>Cancelar</button>
            <button className="btn btn-primary" onClick={save}>Guardar</button>
          </div>
        </Modal>
      )}
      {del&&<Confirm mensaje="¿Eliminar este PNJ?" onConfirm={()=>{eliminarPnj(del);setDel(null)}} onCancel={()=>setDel(null)}/>}
    </div>
  )
}

// ─── Tab Relaciones ───────────────────────────────────────────────────────────
function TabRelaciones() {
  const {partidaActiva,personajes,setRelacion,getRelacion}=useStore(s=>s)
  const [form,setForm]=useState({pid1:'',pid2:'',tipo:'Amistad',valor:50})
  const [saving,setSaving]=useState(false)
  const jugadores=(partidaActiva?.jugadores||[]).map(id=>personajes.find(p=>p.usuarioId===id&&p.gameId===partidaActiva.id)).filter(Boolean)
  const rels=partidaActiva?.relaciones||[]

  const save=()=>{
    if(!form.pid1||!form.pid2||form.pid1===form.pid2) return
    setRelacion(form.pid1,form.pid2,form.tipo,form.valor)
    setSaving(false)
  }

  const valColor=v=>v>=70?'var(--green)':v>=40?'var(--blue)':v>=20?'var(--orange)':'var(--red)'

  return (
    <div>
      <div className="flex justify-between items-center mb-3">
        <div className="section-header" style={{margin:0}}>Relaciones entre personajes</div>
        <button className="btn btn-primary btn-sm" onClick={()=>setSaving(true)}>+ Nueva</button>
      </div>

      {!rels.length?<div className="empty-state"><div className="icon">🔗</div><p>Sin relaciones definidas</p></div>:(
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {rels.map(r=>{
            const p1=jugadores.find(p=>p.id===r.pid1||p.id===r.pid1)
            const p2=jugadores.find(p=>p.id===r.pid2||p.id===r.pid2)
            return (
              <div key={r.key} className="card" style={{padding:'10px 12px'}}>
                <div className="flex gap-2 items-center">
                  <span style={{fontSize:18}}>{RELACION_EMOJI[r.tipo]||'🔗'}</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600}}>
                      {p1?.nombre||r.pid1} ↔ {p2?.nombre||r.pid2}
                    </div>
                    <div style={{fontSize:12,color:'var(--text-muted)'}}>{r.tipo}</div>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <div style={{fontWeight:700,color:valColor(r.valor)}}>{r.valor}/100</div>
                    <div style={{width:60,marginTop:3}}>
                      <div className="hp-bar" style={{height:4}}>
                        <div style={{width:`${r.valor}%`,height:'100%',borderRadius:2,background:valColor(r.valor)}}/>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )
          })}
        </div>
      )}

      {saving&&(
        <Modal titulo="+ Nueva relación" onClose={()=>setSaving(false)} size="modal-sm">
          <div className="form-group"><label>Personaje 1</label>
            <select value={form.pid1} onChange={e=>setForm(f=>({...f,pid1:e.target.value}))}>
              <option value="">-- Seleccionar --</option>
              {jugadores.map(p=><option key={p.id} value={p.id}>{p.nombre}</option>)}
            </select>
          </div>
          <div className="form-group"><label>Personaje 2</label>
            <select value={form.pid2} onChange={e=>setForm(f=>({...f,pid2:e.target.value}))}>
              <option value="">-- Seleccionar --</option>
              {jugadores.filter(p=>p.id!==form.pid1).map(p=><option key={p.id} value={p.id}>{p.nombre}</option>)}
            </select>
          </div>
          <div className="form-group"><label>Tipo de relación</label>
            <select value={form.tipo} onChange={e=>setForm(f=>({...f,tipo:e.target.value}))}>
              {TIPOS_RELACION.map(t=><option key={t}>{t}</option>)}
            </select>
          </div>
          <div className="form-group"><label>Valor: {form.valor}/100</label>
            <input type="range" min={0} max={100} value={form.valor} onChange={e=>setForm(f=>({...f,valor:parseInt(e.target.value)}))} style={{background:'none',border:'none',padding:0,width:'100%',cursor:'pointer'}}/>
          </div>
          <div className="modal-actions">
            <button className="btn btn-ghost" onClick={()=>setSaving(false)}>Cancelar</button>
            <button className="btn btn-primary" onClick={save}>Guardar</button>
          </div>
        </Modal>
      )}
    </div>
  )
}

// ─── Tab Armas ────────────────────────────────────────────────────────────────
function TabArmas() {
  const {armas,crearArmaCustom,eliminarArmaCustom,usuarioActual}=useStore(s=>s)
  const [showForm,setShowForm]=useState(false)
  const [form,setForm]=useState({nombre:'',dadoCantidad:1,dadoCaras:8,modificador:0,descripcion:'',icono:'⚔️'})
  const [del,setDel]=useState(null)

  const save=()=>{
    if(!form.nombre.trim()) return
    crearArmaCustom({...form,dadoCantidad:parseInt(form.dadoCantidad)||1,dadoCaras:parseInt(form.dadoCaras)||8,modificador:parseInt(form.modificador)||0})
    setShowForm(false); setForm({nombre:'',dadoCantidad:1,dadoCaras:8,modificador:0,descripcion:'',icono:'⚔️'})
  }

  return (
    <div>
      <div className="flex justify-between items-center mb-3">
        <div className="section-header" style={{margin:0}}>Catálogo de armas ({armas.length})</div>
        <button className="btn btn-primary btn-sm" onClick={()=>setShowForm(true)}>+ Nueva arma</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))',gap:8}}>
        {armas.map(a=>(
          <div key={a.id} className="card" style={{padding:'10px 12px'}}>
            <div className="flex gap-2 items-center">
              <span style={{fontSize:22}}>{a.icono||'⚔️'}</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:13}}>{a.nombre}</div>
                <div style={{fontSize:12,color:'var(--gold)',fontWeight:600}}>🎲 {a.dadoCantidad}d{a.dadoCaras}{a.modificador?`+${a.modificador}`:''}</div>
                {a.descripcion&&<div style={{fontSize:11,color:'var(--text-muted)'}}>{a.descripcion}</div>}
              </div>
              {a.creadoPor&&a.creadoPor!=='system'&&a.creadoPor===usuarioActual?.id&&(
                <button className="btn btn-danger btn-sm btn-icon" onClick={()=>setDel(a.id)}>✕</button>
              )}
            </div>
          </div>
        ))}
      </div>
      {showForm&&(
        <Modal titulo="+ Nueva arma personalizada" onClose={()=>setShowForm(false)}>
          <div className="form-group"><label>Nombre</label><input value={form.nombre} onChange={e=>setForm(f=>({...f,nombre:e.target.value}))} autoFocus placeholder="ej: Espadón rúnico"/></div>
          <div className="form-row-3">
            <div className="form-group"><label>Cantidad dados</label><input type="number" min={1} value={form.dadoCantidad} onChange={e=>setForm(f=>({...f,dadoCantidad:e.target.value}))}/></div>
            <div className="form-group"><label>Caras dado</label>
              <select value={form.dadoCaras} onChange={e=>setForm(f=>({...f,dadoCaras:e.target.value}))}>
                {[4,6,8,10,12,20].map(c=><option key={c} value={c}>d{c}</option>)}
              </select>
            </div>
            <div className="form-group"><label>Modificador</label><input type="number" value={form.modificador} onChange={e=>setForm(f=>({...f,modificador:e.target.value}))}/></div>
          </div>
          <div className="form-row">
            <div className="form-group"><label>Icono (emoji)</label><input value={form.icono} onChange={e=>setForm(f=>({...f,icono:e.target.value}))} maxLength={2}/></div>
            <div className="form-group"><label>Descripción</label><input value={form.descripcion} onChange={e=>setForm(f=>({...f,descripcion:e.target.value}))} placeholder="Propiedades especiales"/></div>
          </div>
          <div style={{background:'var(--bg-secondary)',borderRadius:'var(--radius)',padding:10,marginBottom:12,fontSize:13,color:'var(--gold)'}}>
            Vista previa: {form.icono} {form.nombre||'Arma'} → {form.dadoCantidad}d{form.dadoCaras}{form.modificador>0?`+${form.modificador}`:form.modificador<0?form.modificador:''}
          </div>
          <div className="modal-actions">
            <button className="btn btn-ghost" onClick={()=>setShowForm(false)}>Cancelar</button>
            <button className="btn btn-primary" onClick={save}>Crear arma</button>
          </div>
        </Modal>
      )}
      {del&&<Confirm mensaje="¿Eliminar esta arma?" onConfirm={()=>{eliminarArmaCustom(del);setDel(null)}} onCancel={()=>setDel(null)}/>}
    </div>
  )
}

// ─── Tab Estados DJ ────────────────────────────────────────────────────────────
function TabEstadosDJ() {
  const {estadosDisponibles,crearEstadoCustom}=useStore(s=>s)
  const [showForm,setShowForm]=useState(false)
  const [form,setForm]=useState({nombre:'',icono:'✨',descripcion:'',duracion:2,tipo:'negativo',efecto:'ninguno',valorEfecto:0})

  const save=()=>{
    if(!form.nombre.trim()) return
    crearEstadoCustom({...form,duracion:parseInt(form.duracion)||2,valorEfecto:parseInt(form.valorEfecto)||0})
    setShowForm(false); setForm({nombre:'',icono:'✨',descripcion:'',duracion:2,tipo:'negativo',efecto:'ninguno',valorEfecto:0})
  }
  return (
    <div>
      <div className="flex justify-between items-center mb-3">
        <div className="section-header" style={{margin:0}}>Estados disponibles ({estadosDisponibles.length})</div>
        <button className="btn btn-primary btn-sm" onClick={()=>setShowForm(true)}>+ Nuevo estado</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:8}}>
        {estadosDisponibles.map(e=>(
          <div key={e.id} className="card" style={{padding:'10px 12px',borderLeft:`3px solid ${e.tipo==='positivo'?'var(--green)':'var(--red)'}`}}>
            <div style={{fontWeight:600,fontSize:14,marginBottom:4}}>{e.icono} {e.nombre}</div>
            <p style={{fontSize:12,color:'var(--text-secondary)',marginBottom:6}}>{e.descripcion}</p>
            <div className="flex gap-2" style={{flexWrap:'wrap'}}>

}

// ─── Tab Iniciativa ────────────────────────────────────────────────────────────
function TabIniciativa() {
  const {iniciativa,turnoActual,combateActivo,iniciarIniciativa,moverEnIniciativa,siguienteTurno,iniciarCombate}=useStore(s=>s)
  const [drag,setDrag]=useState(null)
  const over=(e,idx)=>{e.preventDefault();if(drag!==null&&drag!==idx){moverEnIniciativa(drag,idx);setDrag(idx)}}
  if(!combateActivo) return (
    <div className="empty-state"><div className="icon">⚡</div><p>Combate no activo</p>
      <button className="btn btn-gold" style={{marginTop:12}} onClick={iniciarCombate}>⚔️ Iniciar combate</button>
    </div>
  )
  return (
    <div>
      <div className="flex gap-2 mb-3">
        <button className="btn btn-primary flex-1" onClick={iniciarIniciativa}>🎲 Relanzar iniciativa</button>
        <button className="btn btn-gold" onClick={siguienteTurno}>➡ Siguiente</button>
      </div>
      {!iniciativa.length?<div className="empty-state"><p>Lanza la iniciativa primero</p></div>:(
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {iniciativa.map((item,idx)=>(
            <div key={item.id} className={`init-item ${idx===turnoActual?'current':''} ${item.derrotado?'defeated':''}`}
              draggable onDragStart={()=>setDrag(idx)} onDragOver={e=>over(e,idx)} onDragEnd={()=>setDrag(null)}>
              <span style={{width:28,height:28,borderRadius:'50%',background:idx===turnoActual?'var(--gold)':'var(--bg-tertiary)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:idx===turnoActual?'#000':'var(--text-muted)',flexShrink:0}}>
                {idx+1}
              </span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:13,display:'flex',alignItems:'center',gap:6}}>
                  {item.tipo==='jugador'?'🧙':'💀'} {item.nombre}
                  {item.derrotado&&<span style={{color:'var(--red)',fontSize:11}}>Derrotado</span>}
                  {idx===turnoActual&&<span className="badge badge-gold" style={{fontSize:10}}>▶ Turno</span>}
                </div>
                <div style={{fontSize:11,color:'var(--text-muted)'}}>Roll: {item.roll} · HP: {item.vidaActual}/{item.vidaMax}</div>
              </div>
              <span style={{fontSize:13,color:'var(--text-muted)',userSelect:'none',cursor:'grab'}}>☰</span>
            </div>
          ))}
        </div>
      )}
    </div>
  )
}

              whiteSpace:'nowrap',transition:'color 0.15s',fontFamily:'var(--font)',

        {tab==='combate'    && <TabCombate personaje={miPersonaje}/>}

        {tab==='equipo'     && miPersonaje && <TabEquipo personaje={miPersonaje}/>}

// ─── Crear personaje ───────────────────────────────────────────────────────────
function TabCrearPersonaje({ onCreado }) {
  const clases        = useStore(s => s.clases)
  const crearPersonaje= useStore(s => s.crearPersonaje)
  const combateActivo = useStore(s => s.combateActivo)
  const [form, setForm] = useState({
    nombre:'', claseId:'guerrero', retrato:'', descripcion:'',
    str:10, dex:10, con:10, int:10, wis:10, cha:10, oro:0,
  })
  const [puntosUsados, setPuntosUsados] = useState(0)
  const PUNTOS_TOTAL = 27

  if (combateActivo) return (
    <div className="empty-state">
      <div className="icon">🔒</div>
      <p>No puedes crear personaje durante un combate</p>
    </div>
  )

  const claseSeleccionada = clases.find(c => c.id === form.claseId)
  const vidaEstimada = claseSeleccionada ? hpMaxima(claseSeleccionada, 1, form.con) : 10

  const costeStat = v => {
    if (v<=8) return 0; if (v===9) return 1; if (v===10) return 2; if (v===11) return 3
    if (v===12) return 4; if (v===13) return 5; if (v===14) return 7; return 9
  }
  const setStat = (key, val) => {
    const clamped = Math.max(8, Math.min(15, val))
    const diff = costeStat(clamped) - costeStat(form[key])
    if (puntosUsados + diff > PUNTOS_TOTAL && diff > 0) return
    setPuntosUsados(p => p + diff)
    setForm(f => ({...f, [key]: clamped}))
  }

  const STATS = [
    {key:'str',label:'FUE',desc:'Fuerza – ataques cuerpo a cuerpo, carga'},
    {key:'dex',label:'DES',desc:'Destreza – sigilo, iniciativa, ataques ágiles'},
    {key:'con',label:'CON',desc:'Constitución – puntos de vida, resistencia'},
    {key:'int',label:'INT',desc:'Inteligencia – hechizos, conocimiento'},
    {key:'wis',label:'SAB',desc:'Sabiduría – percepción, curación'},
    {key:'cha',label:'CAR',desc:'Carisma – persuasión, intimidación'},
  ]

  return (
    <div style={{maxWidth:600,margin:'0 auto'}}>
      <div className="section-header">✨ Crear personaje</div>

      <div className="form-group">
        <label>Nombre del personaje</label>
        <input value={form.nombre} onChange={e=>setForm(f=>({...f,nombre:e.target.value}))} placeholder="¿Cómo se llama tu héroe?" autoFocus/>
      </div>

      <div className="form-group">
        <label>Clase</label>
        <select value={form.claseId} onChange={e=>setForm(f=>({...f,claseId:e.target.value}))}>
          {clases.map(c => <option key={c.id} value={c.id}>{c.nombre}{c.isCustom?' (Custom)':''}</option>)}
        </select>
      </div>

      {claseSeleccionada && (
        <div style={{background:'var(--bg-secondary)',borderRadius:'var(--radius)',padding:12,marginBottom:12}}>
          <div style={{fontWeight:600,color:'var(--gold)',marginBottom:6}}>{claseSeleccionada.nombre}</div>
          <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:6}}>
            Vida base: <strong>{claseSeleccionada.vidaBase}</strong> · +{claseSeleccionada.vidaPorNivel}/nivel ·
            HP estimada nv.1: <strong style={{color:'var(--green)'}}>{vidaEstimada}</strong>
          </div>
          {(claseSeleccionada.recursosEspeciales||[]).map(r => (
            <div key={r.nombre} style={{fontSize:12,color:'var(--text-secondary)'}}>
              {r.icono} {r.nombre}: {r.max} máximo
            </div>
          ))}
          <div style={{marginTop:8,display:'flex',flexWrap:'wrap',gap:4}}>
            {(claseSeleccionada.habilidades||[]).map(h => (
              <span key={h.id} className="skill-chip">{h.icono} {h.nombre}</span>
            ))}
          </div>
        </div>
      )}

      {/* Atributos con sistema de puntos */}
      <div style={{marginBottom:12}}>
        <div className="flex justify-between items-center mb-2">
          <div className="section-header" style={{margin:0}}>Atributos</div>
          <span style={{fontSize:12,color:puntosUsados>PUNTOS_TOTAL?'var(--red)':'var(--text-secondary)'}}>
            Puntos libres: <strong style={{color:'var(--gold)'}}>{PUNTOS_TOTAL-puntosUsados}</strong>/{PUNTOS_TOTAL}
          </span>
        </div>
        <div className="grid-6">
          {STATS.map(({key,label,desc}) => (
            <div key={key} className="stat-box" title={desc}>
              <div className="stat-name">{label}</div>
              <button onClick={()=>setStat(key,form[key]+1)} style={{background:'none',border:'none',color:'var(--purple-bright)',cursor:'pointer',fontSize:14,lineHeight:1,padding:0}}>▲</button>
              <div className="stat-value">{form[key]}</div>
              <button onClick={()=>setStat(key,form[key]-1)} style={{background:'none',border:'none',color:'var(--text-muted)',cursor:'pointer',fontSize:14,lineHeight:1,padding:0}}>▼</button>
              <div className="stat-mod">{modStr(form[key])}</div>
            </div>
          ))}
        </div>
        <p style={{fontSize:11,color:'var(--text-muted)',marginTop:6}}>Rango: 8–15. Los puntos cuestan más a valores altos.</p>
      </div>

      <div className="form-row">
        <div className="form-group">
          <label>URL retrato (opcional)</label>
          <input value={form.retrato} onChange={e=>setForm(f=>({...f,retrato:e.target.value}))} placeholder="https://..."/>
        </div>
        <div className="form-group">
          <label>Oro inicial</label>
          <input type="number" min={0} value={form.oro} onChange={e=>setForm(f=>({...f,oro:parseInt(e.target.value)||0}))}/>
        </div>
      </div>

      <div className="form-group">
        <label>Trasfondo (opcional)</label>
        <textarea rows={3} value={form.descripcion} onChange={e=>setForm(f=>({...f,descripcion:e.target.value}))} placeholder="¿Quién es tu personaje? ¿De dónde viene? ¿Qué busca?" style={{resize:'vertical'}}/>
      </div>

      <button className="btn btn-primary" style={{width:'100%',marginTop:4}} disabled={!form.nombre.trim()||puntosUsados>PUNTOS_TOTAL}
        onClick={()=>{crearPersonaje(form);onCreado()}}>
        ✨ Crear personaje
      </button>
    </div>
  )
}

      {/* Notas adicionales */}
      <div style={{marginTop:12}}>

          {[
            {label:'Iniciativa',valor:`${modStr(personaje.dex)}`,desc:'DEX'},
            {label:'Velocidad',valor:'30 m',desc:'Base'},
            {label:'Percepción',valor:`${10+calcMod(personaje.wis)}`,desc:'10+SAB'},
          ].map(item=>(
            <div key={item.label} style={{background:'var(--bg-secondary)',borderRadius:'var(--radius)',padding:'8px',textAlign:'center'}}>

          🔒 La ficha está bloqueada durante el combate.

      )}

  )
}

// ─── Tab Recursos ─────────────────────────────────────────────────────────────
function TabRecursos({ personaje }) {
  const clases = useStore(s => s.clases)
  const actualizarPersonaje = useStore(s => s.actualizarPersonaje)
  const clase = clases.find(c => c.id === personaje.claseId)
  const recursosEsp = clase?.recursosEspeciales || []
  const actuales = personaje.recursosActuales || {}

  const setRecurso = (nombre, val) => {
    const max = recursosEsp.find(r => r.nombre === nombre)?.max || 10
    actualizarPersonaje(personaje.id, {recursosActuales:{...actuales,[nombre]:Math.max(0,Math.min(max,val))}})
  }

  return (
    <div>
      <div className="section-header">Recursos de {clase?.nombre}</div>

      {!recursosEsp.length ? (
        <div className="empty-state"><p>Esta clase no tiene recursos especiales</p></div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {recursosEsp.map(r => {
            const actual = actuales[r.nombre] ?? r.max
            const pct = r.max > 0 ? actual / r.max : 0
            return (
              <div key={r.nombre} className="card">
                <div className="flex justify-between items-center" style={{marginBottom:8}}>
                  <div style={{fontWeight:600,fontSize:15}}>{r.icono} {r.nombre}</div>
                  <div style={{fontSize:20,fontWeight:700,color:'var(--purple-bright)'}}>{actual}<span style={{color:'var(--text-muted)',fontSize:13,fontWeight:400}}>/{r.max}</span></div>
                </div>
                <div className="hp-bar" style={{height:10,marginBottom:10}}>
                  <div style={{width:`${pct*100}%`,height:'100%',borderRadius:5,background:'var(--purple-bright)',transition:'width .3s'}}/>
                </div>
                {/* Puntos visuales */}
                <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
                  {Array.from({length:r.max},(_,i)=>(
                    <button key={i} onClick={()=>setRecurso(r.nombre,i<actual?i:i+1)}
                      style={{width:28,height:28,borderRadius:'50%',border:`2px solid var(--purple)`,
                        background:i<actual?'var(--purple)':'transparent',cursor:'pointer',transition:'all .15s'}}>
                    </button>
                  ))}
                </div>
                <div className="flex gap-2">
                  <button className="btn btn-ghost btn-sm" onClick={()=>setRecurso(r.nombre,actual-1)}>− Gastar</button>
                  <button className="btn btn-primary btn-sm" onClick={()=>setRecurso(r.nombre,r.max)}>↺ Descanso</button>
                </div>
              </div>
            )
          })}
        </div>
      )}

      {/* Oro editable */}
      <div className="section-header" style={{marginTop:16}}>Oro y Riquezas</div>
      <div className="card">
        <div className="flex gap-3 items-center">
          <span style={{fontSize:28}}>🪙</span>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:24,color:'var(--gold)'}}>{personaje.oro}</div>
            <div style={{fontSize:12,color:'var(--text-muted)'}}>piezas de oro</div>
          </div>
        </div>
      </div>
    </div>
  )
}

// ─── Tab Combate (jugador) ─────────────────────────────────────────────────────
function TabCombate({ personaje }) {
  const combateActivo = useStore(s => s.combateActivo)
  const iniciativa    = useStore(s => s.iniciativa)
  const turnoActual   = useStore(s => s.turnoActual)
  const partidaActiva = useStore(s => s.partidaActiva)
  const personajes    = useStore(s => s.personajes)
  const armas         = useStore(s => s.armas)
  const tirar         = useStore(s => s.tirar)
  const clases        = useStore(s => s.clases)

  const enCombate  = partidaActiva?.enemigosEnCombate || []
  const jugadores  = (partidaActiva?.jugadores || [])
    .map(id => personajes.find(p => p.usuarioId === id && p.gameId === partidaActiva.id))
    .filter(Boolean)

  const [armaSel, setArmaSel] = useState('')
  const [lastAtaque, setLastAtaque] = useState(null)

  if (!combateActivo) return (
    <div className="empty-state">
      <div className="icon">⚔️</div>
      <p>No hay combate activo</p>
      <p style={{fontSize:12,marginTop:4}}>El DJ iniciará el combate cuando sea necesario</p>
    </div>
  )

  const armaSelObj = armas.find(a => a.id === armaSel)

  const atacar = () => {
    if (!armaSelObj || !personaje) return
    // Tirada de ataque
    const modAtk = calcMod(personaje.dex)
    const ataque = tirar({dados:[{cantidad:1,caras:20}],modificador:modAtk,etiqueta:`Ataque con ${armaSelObj.nombre}`,personajeNombre:personaje.nombre})
    // Tirada de daño
    const modDmg = calcMod(armaSelObj.nombre.includes('arco')||armaSelObj.nombre.includes('Arco')?personaje.dex:personaje.str)
    const daño   = tirar({dados:[{cantidad:armaSelObj.dadoCantidad,caras:armaSelObj.dadoCaras}],modificador:(armaSelObj.modificador||0)+modDmg,etiqueta:`Daño ${armaSelObj.nombre}`,personajeNombre:personaje.nombre})
    setLastAtaque({ataque,daño,arma:armaSelObj.nombre})
  }

  return (
    <div>
      {/* Orden de turno */}
      {iniciativa.length > 0 && (
        <div style={{marginBottom:16}}>
          <div className="section-header">Orden de turno</div>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            {iniciativa.map((item,idx) => (
              <div key={item.id} style={{display:'flex',gap:8,alignItems:'center',padding:'6px 10px',
                background:idx===turnoActual?'rgba(212,175,55,0.08)':'var(--bg-secondary)',
                border:`1px solid ${idx===turnoActual?'var(--gold)':'var(--border)'}`,borderRadius:'var(--radius)',fontSize:13}}>
                <span style={{width:20,textAlign:'center',fontSize:11,color:'var(--text-muted)',fontWeight:700}}>{idx+1}</span>
                <span>{item.tipo==='jugador'?'🧙':'💀'}</span>
                <span style={{flex:1}}>{item.nombre}</span>
                {idx===turnoActual && <span className="badge badge-gold" style={{fontSize:10}}>▶ Turno</span>}
                {item.derrotado && <span style={{color:'var(--red)',fontSize:11}}>✕</span>}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Atacar rápido */}
      {personaje && (
        <div className="card" style={{marginBottom:16}}>
          <div className="card-title">⚔️ Atacar</div>
          <div className="form-group">
            <label>Arma equipada / seleccionar</label>
            <select value={armaSel} onChange={e=>setArmaSel(e.target.value)}>
              <option value="">-- Elegir arma --</option>
              {armas.map(a=><option key={a.id} value={a.id}>{a.icono} {a.nombre} ({a.dadoCantidad}d{a.dadoCaras}{a.modificador?`+${a.modificador}`:''})</option>)}
            </select>
          </div>
          {armaSelObj && (
            <div style={{marginBottom:10,padding:'6px 10px',background:'var(--bg-secondary)',borderRadius:'var(--radius)',fontSize:12,color:'var(--text-secondary)'}}>
              🎲 Daño: {armaSelObj.dadoCantidad}d{armaSelObj.dadoCaras}{armaSelObj.modificador?`+${armaSelObj.modificador}`:''} · {armaSelObj.descripcion}
            </div>
          )}
          <button className="btn btn-danger" style={{width:'100%'}} onClick={atacar} disabled={!armaSel}>
            ⚔️ Tirar ataque + daño
          </button>
          {lastAtaque && (
            <div style={{marginTop:10,display:'flex',flexDirection:'column',gap:6}}>
              <div className={`dice-result ${lastAtaque.ataque.esCritico?'crit':lastAtaque.ataque.esFallo?'fail':''}`}>
                <span style={{fontSize:11,color:'var(--text-muted)'}}>ATK</span>
                <span style={{fontWeight:700,fontSize:18,color:lastAtaque.ataque.esCritico?'var(--gold)':lastAtaque.ataque.esFallo?'var(--red)':'var(--text-primary)'}}>{lastAtaque.ataque.total}</span>
                <span style={{fontSize:11,color:'var(--text-secondary)'}}>vs Armadura</span>
                {lastAtaque.ataque.esCritico && <span style={{color:'var(--gold)'}}>🌟 ¡CRÍTICO!</span>}
                {lastAtaque.ataque.esFallo   && <span style={{color:'var(--red)'}}>💀 FALLO</span>}
              </div>
              <div className="dice-result">
                <span style={{fontSize:11,color:'var(--text-muted)'}}>DMG</span>
                <span style={{fontWeight:700,fontSize:18,color:'var(--red)'}}>{lastAtaque.daño.total}</span>
                <span style={{fontSize:11,color:'var(--text-secondary)'}}>{lastAtaque.arma}</span>
              </div>
            </div>
          )}
        </div>
      )}

      {/* Aliados */}
      <div className="section-header">Aliados</div>
      <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:16}}>
        {jugadores.map(p => (
          <div key={p.id} style={{display:'flex',gap:8,alignItems:'center',padding:'6px 10px',
            background:'var(--bg-secondary)',border:'1px solid var(--border)',borderRadius:'var(--radius)'}}>
            <Portrait src={p.retrato} nombre={p.nombre} size={28}/>
            <span style={{flex:1,fontSize:13,fontWeight:p.id===personaje?.id?600:400}}>
              {p.nombre}{p.id===personaje?.id?' (tú)':''}
            </span>
            {(p.estados||[]).length>0 && (
              <div style={{display:'flex',gap:2}}>
                {p.estados.slice(0,3).map(e=><span key={e.id} title={e.nombre}>{e.icono}</span>)}
              </div>
            )}
            <span style={{fontSize:12}}>{p.vidaActual}/{p.vidaMax}</span>
            <div style={{width:60}}><HPBar actual={p.vidaActual} max={p.vidaMax} showNumbers={false} height={6}/></div>
          </div>
        ))}
      </div>

      {/* Enemigos (solo nombre y vida, NO estadísticas) */}
      <div className="section-header">Enemigos</div>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {!enCombate.length
          ? <div style={{fontSize:13,color:'var(--text-muted)',textAlign:'center',padding:12}}>Sin enemigos en combate</div>
          : enCombate.map(e => (
            <div key={e.instanciaId} className="card" style={{padding:'10px 12px',opacity:e.derrotado?0.5:1}}>
              <div className="flex gap-2 items-center" style={{marginBottom:6}}>
                <span style={{fontSize:18}}>💀</span>
                <span style={{flex:1,fontWeight:600,fontSize:13}}>{e.nombre}</span>
                <BadgeTipoEnemigo tipo={e.tipo}/>
                {e.derrotado && <span style={{color:'var(--red)',fontSize:12}}>Derrotado</span>}
              </div>
              <HPBar actual={e.vidaActual} max={e.vidaMax} showNumbers={false} height={8}/>
              <div style={{fontSize:11,color:'var(--text-muted)',marginTop:3,textAlign:'right'}}>{e.vidaActual}/{e.vidaMax} HP</div>
              {/* Los jugadores NO ven ataque/defensa ni stats completos */}
            </div>
          ))
        }
      </div>
    </div>
  )
}

// ─── Tab Inventario ────────────────────────────────────────────────────────────
function TabInventario({ personaje }) {
  const agregarAlInventario  = useStore(s => s.agregarAlInventario)
  const quitarDelInventario  = useStore(s => s.quitarDelInventario)
  const actualizarPersonaje  = useStore(s => s.actualizarPersonaje)
  const combateActivo        = useStore(s => s.combateActivo)
  const armas                = useStore(s => s.armas)
  const [showAdd, setShowAdd]= useState(false)
  const [filtro, setFiltro]  = useState('todos')
  const [form, setForm]      = useState({nombre:'',descripcion:'',cantidad:1,tipo:'general',icono:'📦'})

  const inv = personaje.inventario || []
  const TIPOS = ['todos','general','arma','armadura','consumible','magia','quest']
  const EMOJIS = {general:'📦',arma:'⚔️',armadura:'🛡️',consumible:'🧪',magia:'✨',quest:'📜'}
  const filtrado = filtro==='todos' ? inv : inv.filter(i=>i.tipo===filtro)
  const pesoTotal = inv.reduce((a,i)=>(a+(i.peso||0)*i.cantidad),0)

  const addArmaRapida = a => {
    agregarAlInventario(personaje.id,{
      nombre:a.nombre, descripcion:`Daño: ${a.dadoCantidad}d${a.dadoCaras}${a.modificador?`+${a.modificador}`:''}`,
      cantidad:1, tipo:'arma', icono:a.icono||'⚔️', apilable:false,
      dadoCantidad:a.dadoCantidad, dadoCaras:a.dadoCaras, modificador:a.modificador,
    })
    setShowAdd(false)
  }

  const save = () => {
    if (!form.nombre.trim()) return
    agregarAlInventario(personaje.id, form)
    setShowAdd(false)
    setForm({nombre:'',descripcion:'',cantidad:1,tipo:'general',icono:'📦'})
  }

  return (
    <div>
      {/* Header */}
      <div className="flex justify-between items-center" style={{marginBottom:12}}>
        <div>
          <div style={{fontWeight:600}}>Inventario <span style={{color:'var(--text-muted)',fontWeight:400,fontSize:12}}>({inv.length} objetos · ⚖ {pesoTotal.toFixed(1)}kg)</span></div>
          <div style={{fontSize:12,color:'var(--gold)'}}>🪙 {personaje.oro} oro</div>
        </div>
        {!combateActivo && <button className="btn btn-primary btn-sm" onClick={()=>setShowAdd(true)}>+ Añadir</button>}
      </div>

      {/* Filtros */}
      <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:12}}>
        {TIPOS.map(t => (
          <button key={t} onClick={()=>setFiltro(t)}
            className={`btn btn-sm ${filtro===t?'btn-primary':'btn-ghost'}`}>
            {t==='todos'?'Todos':EMOJIS[t]+' '+t}
          </button>
        ))}
      </div>

      {/* Oro editable */}
      {!combateActivo && (
        <div className="flex gap-2 items-center" style={{marginBottom:12}}>
          <label style={{margin:0,whiteSpace:'nowrap'}}>🪙 Oro:</label>
          <input type="number" min={0} value={personaje.oro}
            onChange={e=>actualizarPersonaje(personaje.id,{oro:parseInt(e.target.value)||0})}
            style={{width:90}}/>
        </div>
      )}

      {/* Lista */}
      {!filtrado.length
        ? <div className="empty-state"><div className="icon">🎒</div><p>Sin objetos {filtro!=='todos'?`de tipo "${filtro}"`:''}</p></div>
        : <div style={{display:'flex',flexDirection:'column',gap:5}}>
            {filtrado.map(item => (
              <div key={item.id} className="inv-item">
                <div className="flex gap-2 items-center flex-1">
                  <span style={{fontSize:18}}>{EMOJIS[item.tipo]||'📦'}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:500,fontSize:13}}>{item.nombre}</div>
                    {item.descripcion && <div style={{fontSize:11,color:'var(--text-muted)'}}>{item.descripcion}</div>}
                    {item.dadoCaras && (
                      <div style={{fontSize:11,color:'var(--gold)'}}>🎲 {item.dadoCantidad}d{item.dadoCaras}{item.modificador?`+${item.modificador}`:''}</div>
                    )}
                  </div>
                </div>
                <div className="flex gap-2 items-center">
                  <span className="badge badge-gray">×{item.cantidad}</span>
                  {!combateActivo && (
                    <button className="btn btn-danger btn-sm btn-icon" onClick={()=>quitarDelInventario(personaje.id,item.id)}>✕</button>
                  )}
                </div>
              </div>
            ))}
          </div>
      }

      {/* Modal añadir */}
      {showAdd && (
        <Modal titulo="+ Añadir objeto" onClose={()=>setShowAdd(false)} size="modal-lg">
          {/* Armas rápidas */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:6,fontWeight:600}}>⚔️ Añadir arma rápida:</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
              {armas.map(a => (
                <button key={a.id} className="btn btn-ghost btn-sm" onClick={()=>addArmaRapida(a)}>
                  {a.icono} {a.nombre} <span style={{color:'var(--gold)',fontSize:10}}>{a.dadoCantidad}d{a.dadoCaras}</span>
                </button>
              ))}
            </div>
          </div>
          <div className="divider"/>
          <div className="section-header">Objeto personalizado</div>
          <div className="form-group"><label>Nombre</label><input value={form.nombre} onChange={e=>setForm(f=>({...f,nombre:e.target.value}))} autoFocus/></div>
          <div className="form-group"><label>Descripción</label><input value={form.descripcion} onChange={e=>setForm(f=>({...f,descripcion:e.target.value}))}/></div>
          <div className="form-row">
            <div className="form-group"><label>Tipo</label>
              <select value={form.tipo} onChange={e=>setForm(f=>({...f,tipo:e.target.value}))}>
                {['general','arma','armadura','consumible','magia','quest'].map(t=><option key={t}>{t}</option>)}
              </select>
            </div>
            <div className="form-group"><label>Cantidad</label><input type="number" min={1} value={form.cantidad} onChange={e=>setForm(f=>({...f,cantidad:parseInt(e.target.value)||1}))}/></div>
          </div>
          <div className="modal-actions">
            <button className="btn btn-ghost" onClick={()=>setShowAdd(false)}>Cancelar</button>
            <button className="btn btn-primary" onClick={save}>Añadir</button>
          </div>
        </Modal>
      )}
    </div>
  )
}

// ─── Tab Habilidades ───────────────────────────────────────────────────────────
function TabHabilidades({ personaje }) {
  const clases = useStore(s => s.clases)
  const actualizarPersonaje = useStore(s => s.actualizarPersonaje)
  const clase  = clases.find(c => c.id === personaje.claseId)
  const habs   = clase?.habilidades || []
  const cds    = personaje.habilidadesCooldown || {}

  const usarHabilidad = (hab) => {
    if (hab.recarga > 0 && cds[hab.id] > 0) return
    if (hab.recarga > 0) {
      actualizarPersonaje(personaje.id,{habilidadesCooldown:{...cds,[hab.id]:hab.recarga}})
    }
    // Gastar recurso si tiene coste
    if (hab.coste > 0 && clase?.recursosEspeciales?.length) {
      const recurso = clase.recursosEspeciales[0]
      const actuals = personaje.recursosActuales || {}
      const cur = actuals[recurso.nombre] ?? recurso.max
      if (cur < hab.coste) return
      actualizarPersonaje(personaje.id,{recursosActuales:{...actuals,[recurso.nombre]:cur-hab.coste}})
    }
  }

  const avanzarTurnoHabs = () => {
    const nuevoCDs = {}
    for (const [id,v] of Object.entries(cds)) nuevoCDs[id] = Math.max(0,v-1)
    actualizarPersonaje(personaje.id,{habilidadesCooldown:nuevoCDs})
  }

  const activas  = habs.filter(h => h.tipo==='activa')
  const pasivas  = habs.filter(h => h.tipo==='pasiva')

  return (
    <div>
      <div className="flex justify-between items-center mb-2">
        <div className="section-header" style={{margin:0}}>Habilidades de {clase?.nombre}</div>
        <button className="btn btn-ghost btn-sm" onClick={avanzarTurnoHabs} title="Avanzar 1 turno en recargas">⏭ Turno</button>
      </div>

      {activas.length > 0 && (
        <>
          <div className="section-header">Activas</div>
          <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:16}}>
            {activas.map(h => {
              const cd = cds[h.id] || 0
              const enRecarga = cd > 0
              const recurso = clase?.recursosEspeciales?.[0]
              const actuals = personaje.recursosActuales || {}
              const sinRecurso = h.coste > 0 && recurso && (actuals[recurso.nombre]??recurso.max) < h.coste
              return (
                <div key={h.id} className="card" style={{opacity:enRecarga?0.6:1}}>
                  <div className="flex gap-2 items-start">
                    <span style={{fontSize:22,lineHeight:1}}>{h.icono||'⚡'}</span>
                    <div style={{flex:1}}>
                      <div className="flex gap-2 items-center" style={{marginBottom:4}}>
                        <span style={{fontWeight:600,fontSize:14}}>{h.nombre}</span>
                        <span className="badge badge-purple">Activa</span>
                        {enRecarga && <span className="badge badge-orange">⏱ {cd}t</span>}
                      </div>
                      <p style={{fontSize:13,color:'var(--text-secondary)',marginBottom:6}}>{h.descripcion}</p>
                      <div className="flex gap-3" style={{fontSize:12,marginBottom:8}}>
                        {h.daño && <span style={{color:'var(--red)'}}>⚔ {h.daño}</span>}
                        {h.coste>0 && recurso && <span style={{color:'var(--purple-bright)'}}>💎 Coste: {h.coste} {recurso.nombre}</span>}
                        {h.recarga>0 && <span style={{color:'var(--orange)'}}>🔄 Recarga: {h.recarga}t</span>}
                        {h.recarga===0 && <span style={{color:'var(--green)'}}>🔄 Sin recarga</span>}
                      </div>
                      <button className="btn btn-primary btn-sm" disabled={enRecarga||sinRecurso} onClick={()=>usarHabilidad(h)}>
                        {enRecarga?`En recarga (${cd}t)`:sinRecurso?`Sin ${recurso?.nombre}`:'Usar habilidad'}
                      </button>
                    </div>
                  </div>
                </div>
              )
            })}
          </div>
        </>
      )}

      {pasivas.length > 0 && (
        <>
          <div className="section-header">Pasivas</div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {pasivas.map(h => (
              <div key={h.id} className="card">
                <div className="flex gap-2 items-start">
                  <span style={{fontSize:22,lineHeight:1}}>{h.icono||'🌙'}</span>
                  <div>
                    <div className="flex gap-2 items-center" style={{marginBottom:4}}>
                      <span style={{fontWeight:600,fontSize:14}}>{h.nombre}</span>
                      <span className="badge badge-blue">Pasiva</span>
                      <span className="badge badge-green">Siempre activa</span>
                    </div>
                    <p style={{fontSize:13,color:'var(--text-secondary)'}}>{h.descripcion}</p>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </>
      )}

      {!habs.length && <div className="empty-state"><div className="icon">✨</div><p>Sin habilidades definidas para {clase?.nombre}</p></div>}

      {/* Bonificaciones */}
      {(clase?.bonificaciones||[]).length > 0 && (
        <div style={{marginTop:16}}>
          <div className="section-header">Bonificaciones automáticas</div>
          {clase.bonificaciones.map((b,i) => (
            <div key={i} style={{fontSize:13,padding:'6px 0',color:'var(--text-secondary)',borderBottom:'1px solid var(--border)'}}>
              +{b.cantidad} {b.atributo.toUpperCase()} cada {b.cadaNiveles} niveles
            </div>
          ))}
        </div>
      )}
    </div>
  )
}

// ─── Tab Relaciones ────────────────────────────────────────────────────────────
function TabRelacionesJugador({ personaje }) {
  const partidaActiva = useStore(s => s.partidaActiva)
  const personajes    = useStore(s => s.personajes)
  const rels          = partidaActiva?.relaciones || []
  const jugadores     = (partidaActiva?.jugadores || [])
    .map(id => personajes.find(p => p.usuarioId === id && p.gameId === partidaActiva.id))
    .filter(Boolean)

  const misRels = rels.filter(r => r.pid1===personaje.id||r.pid2===personaje.id)
  const valColor = v => v>=70?'var(--green)':v>=40?'var(--blue)':v>=20?'var(--orange)':'var(--red)'

  return (
    <div>
      <div className="section-header">Mis relaciones</div>
      {!misRels.length
        ? <div className="empty-state"><div className="icon">🔗</div><p>Sin relaciones definidas aún</p><p style={{fontSize:12,marginTop:4}}>El DJ puede definirlas desde su panel</p></div>
        : <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {misRels.map(r => {
              const otro = jugadores.find(p => p.id===(r.pid1===personaje.id?r.pid2:r.pid1))
              return (
                <div key={r.key} className="card" style={{padding:'10px 12px'}}>
                  <div className="flex gap-2 items-center">
                    <span style={{fontSize:22}}>{RELACION_EMOJI[r.tipo]||'🔗'}</span>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:600,fontSize:13}}>{r.tipo} con {otro?.nombre||'…'}</div>
                    </div>
                    <div style={{textAlign:'right'}}>
                      <div style={{fontWeight:700,color:valColor(r.valor)}}>{r.valor}/100</div>
                      <div style={{width:60,marginTop:2}}>
                        <div className="hp-bar" style={{height:4}}>
                          <div style={{width:`${r.valor}%`,height:'100%',borderRadius:2,background:valColor(r.valor)}}/>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )
            })}
          </div>
      }

      <div className="section-header" style={{marginTop:16}}>Todas las relaciones del grupo</div>
      {!rels.length
        ? <div style={{fontSize:12,color:'var(--text-muted)',textAlign:'center',padding:12}}>Sin relaciones registradas</div>
        : <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {rels.map(r => {
              const p1 = jugadores.find(p=>p.id===r.pid1)
              const p2 = jugadores.find(p=>p.id===r.pid2)
              return (
                <div key={r.key} style={{display:'flex',gap:8,alignItems:'center',padding:'6px 10px',
                  background:'var(--bg-secondary)',border:'1px solid var(--border)',borderRadius:'var(--radius)',fontSize:12}}>
                  <span>{RELACION_EMOJI[r.tipo]||'🔗'}</span>
                  <span style={{flex:1}}>{p1?.nombre||'?'} ↔ {p2?.nombre||'?'} <span style={{color:'var(--text-muted)'}}>({r.tipo})</span></span>
                  <span style={{fontWeight:700,color:valColor(r.valor)}}>{r.valor}</span>
                </div>
              )
            })}
          </div>
      }
    </div>
  )
}

// ─── Tab Dados Jugador ─────────────────────────────────────────────────────────
function TabDadosJugador({ personaje }) {
  const [subTab,setSubTab] = useState('rapida')
  const armas = useStore(s => s.armas)
  const tirar = useStore(s => s.tirar)
  const [armaSel, setArmaSel] = useState('')
  const [lastDaño, setLastDaño] = useState(null)

  const tirarDaño = () => {
    const a = armas.find(x=>x.id===armaSel)
    if(!a||!personaje) return
    const mod = calcMod(personaje.str)
    const r = tirar({dados:[{cantidad:a.dadoCantidad,caras:a.dadoCaras}],modificador:(a.modificador||0)+mod,etiqueta:`Daño: ${a.nombre}`,personajeNombre:personaje.nombre})
    setLastDaño(r)
  }

  return (
    <div>
      <div className="tabs">
        <button className={`tab ${subTab==='rapida'?'active':''}`} onClick={()=>setSubTab('rapida')}>Rápida</button>
        <button className={`tab ${subTab==='arma'?'active':''}`} onClick={()=>setSubTab('arma')}>Por arma</button>
        <button className={`tab ${subTab==='libre'?'active':''}`} onClick={()=>setSubTab('libre')}>Libre</button>
        <button className={`tab ${subTab==='historial'?'active':''}`} onClick={()=>setSubTab('historial')}>Historial</button>
      </div>

      {subTab==='rapida' && (
        <div>
          <p style={{fontSize:12,color:'var(--text-muted)',marginBottom:12}}>Tiradas preconfiguradas con tus modificadores</p>
          <QuickDice personaje={personaje}/>
        </div>
      )}

      {subTab==='arma' && (
        <div>
          <div className="form-group" style={{marginBottom:10}}>
            <label>Seleccionar arma</label>
            <select value={armaSel} onChange={e=>setArmaSel(e.target.value)}>
              <option value="">-- Elegir --</option>
              {armas.map(a=><option key={a.id} value={a.id}>{a.icono} {a.nombre} ({a.dadoCantidad}d{a.dadoCaras})</option>)}
            </select>
          </div>
          <button className="btn btn-danger" style={{width:'100%',marginBottom:10}} onClick={tirarDaño} disabled={!armaSel}>
            🎲 Tirar daño
          </button>
          {lastDaño && (
            <div className="dice-result">
              <span style={{fontWeight:700,fontSize:20,color:'var(--red)'}}>{lastDaño.total}</span>
              <div>
                <div style={{fontSize:11,color:'var(--text-muted)'}}>[{lastDaño.resultados.map(r=>r.valor).join(',')}]{lastDaño.modificador!==0?(lastDaño.modificador>0?` +${lastDaño.modificador}`:` ${lastDaño.modificador}`):'  '}</div>
                <div style={{fontSize:12,color:'var(--text-secondary)'}}>{lastDaño.etiqueta}</div>
              </div>
            </div>
          )}
        </div>
      )}

      {subTab==='libre' && <DiceRoller personajeNombre={personaje.nombre}/>}
      {subTab==='historial' && <TiradasHistorial ocultas={false}/>}
    </div>
  )
}
